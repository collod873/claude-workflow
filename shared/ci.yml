name: CI

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: Rerun every step, covered or not, to time a whole check
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "${{ startsWith(github.head_ref, 'land/') && 'judged on the owner PC before the push (ADR-0008)' || github.event.sender.login == 'collod873-machine[bot]' && !startsWith(github.head_ref, 'enrol/') && 'judged by the machine before its push (#1345)' || 'check' }}"
    if: ${{ !startsWith(github.head_ref, 'land/') && !(github.event.sender.login == 'collod873-machine[bot]' && !startsWith(github.head_ref, 'enrol/')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Python 3.14 in a venv of its own, so setup can pip install on any runner
        run: |
          venv="$RUNNER_TEMP/python"
          uv venv --quiet --seed --system-site-packages --python-preference system --python 3.14 "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"

      - name: PyYAML for the hooks
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml

      - id: hooks-app
        name: Log in as the core App to read agent-hooks
        if: vars.CORE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-hooks
          permission-contents: read

      - name: Fetch agent-hooks main's check
        env:
          HOOKS_TOKEN: ${{ steps.hooks-app.outputs.token }}
          HOOKS_DEPLOY_KEY: ${{ secrets.HOOKS_DEPLOY_KEY }}
        run: |
          hooks="$RUNNER_TEMP/agent-hooks"
          key="$RUNNER_TEMP/agent-hooks-deploy-key"
          if [ -n "$HOOKS_TOKEN" ]; then
            remote="https://x-access-token:$HOOKS_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/agent-hooks"
          elif [ -n "$HOOKS_DEPLOY_KEY" ]; then
            ( umask 077 && printf '%s\n' "$HOOKS_DEPLOY_KEY" >"$key" )
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            remote="git@github.com:$GITHUB_REPOSITORY_OWNER/agent-hooks.git"
          else
            echo "::error::set vars.CORE_APP_CLIENT_ID with secrets.CORE_APP_PRIVATE_KEY, or secrets.HOOKS_DEPLOY_KEY, so CI can fetch agent-hooks"
            exit 1
          fi
          attempt=1
          until git clone --quiet --depth 1 --branch main "$remote" "$hooks" 2>"$RUNNER_TEMP/agent-hooks-clone.log"; do
            rm -rf "$hooks"
            if [ "$attempt" -ge 3 ]; then
              rm -f "$key"
              { printf '%s\n' "A job cannot fetch the owner's hooks after 3 tries"; cat "$RUNNER_TEMP/agent-hooks-clone.log"; } >"$RUNNER_TEMP/agent-hooks-unreachable.log"
              cat "$RUNNER_TEMP/agent-hooks-unreachable.log"
              exit 1
            fi
            attempt=$((attempt + 1))
          done
          rm -f "$key"
          rm -rf "$hooks/.git"

      - name: Link ~/bin/check
        run: |
          mkdir -p "$HOME/bin"
          ln -sf "$RUNNER_TEMP/agent-hooks/bin/check" "$HOME/bin/check"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: probe
        name: Probe whether receipts or a green check on this same tree already cover every step
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" != push ] && [ "$EVENT" != pull_request ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git diff --quiet "$BASE"...HEAD -- pnpm-lock.yaml; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          ~/bin/check --full --covered || code=$?
          case $code in
            0) echo "due=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "due=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Postgres
        if: steps.probe.outputs.due == 'true' && vars.CI_POSTGRES == 'true'
        env:
          DB_NAME: ${{ vars.CI_DB_NAME || 'app_dev' }}
        run: |
          name="database-${GITHUB_REPOSITORY//[^A-Za-z0-9_.-]/-}-${RUNNER_NAME//[^A-Za-z0-9_.-]/-}"
          echo "DATABASE_CONTAINER=$name" >> "$GITHUB_ENV"
          docker ps --all --quiet --filter "name=^$name\$" | xargs --no-run-if-empty docker rm --force >/dev/null
          docker run --quiet --detach --name "$name" --publish 127.0.0.1::5432 --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB="$DB_NAME" postgres:16 >/dev/null
          timeout 60 bash -c "until docker exec '$name' pg_isready --quiet --host 127.0.0.1 --username postgres --dbname '$DB_NAME'; do sleep 1; done"
          port=$(docker port "$name" 5432/tcp | head -n 1 | sed 's/.*://')
          echo "DATABASE_URL=postgres://app:app@localhost:$port/$DB_NAME" >> "$GITHUB_ENV"
          echo "DATABASE_URL_ADMIN=postgres://postgres:postgres@localhost:$port/$DB_NAME" >> "$GITHUB_ENV"

      - name: Enable pnpm via Corepack
        if: steps.probe.outputs.due == 'true' && hashFiles('pnpm-lock.yaml') != ''
        run: corepack enable

      - id: node
        name: Node (.nvmrc) and the pnpm store cache
        if: steps.probe.outputs.due == 'true' && hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ vars.CI_RUNNER == '' && 'pnpm' || '' }}

      - name: Fill the pnpm store on a miss, so its post step has a store to save even when every check step is covered
        if: steps.probe.outputs.due == 'true' && hashFiles('pnpm-lock.yaml') != '' && vars.CI_RUNNER == '' && steps.node.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - id: check
        name: Check
        if: steps.probe.outputs.due == 'true'
        env:
          FRESH: ${{ inputs.fresh }}
        run: ~/bin/check --full --publish $([ "$FRESH" = true ] && echo --fresh)

      - name: Remove Postgres
        if: always() && env.DATABASE_CONTAINER != ''
        run: docker rm --force "$DATABASE_CONTAINER" >/dev/null
