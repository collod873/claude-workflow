name: Set up Node and install dependencies
description: >
  The runtime every lane runs its entrypoints on: Node pinned to 24, then `npm ci` installing
  exactly what `package-lock.json` names, never a fresh resolve. Three ways to get there, cheapest
  first. A hosted runner keeps nothing between jobs, so `node_modules` is restored whole from the
  Actions cache under the lockfile's hash. A persistent runner keeps a store on its own disk and
  hardlinks it into each workspace, because there `npm ci` spent five minutes relinking 13,000
  unchanged files the previous run had already written. Everything else falls back to `npm ci`.
  `npm ci` runs `prepare`, which puts this repo's husky hooks in place, so the two restore paths
  run `prepare` themselves.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm

    - name: Restore node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      shell: bash
      env:
        RESTORED: ${{ steps.modules.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [ "$RESTORED" = "true" ] && [ -d node_modules ]; then
          echo "node_modules restored from the Actions cache"
          npm run prepare --if-present
          exit 0
        fi
        store="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/node-modules/$(sha256sum package-lock.json | cut -d' ' -f1)"
        if [ -d "$store" ]; then
          rm -rf node_modules
          if cp -al "$store" node_modules 2>/dev/null || cp -a "$store" node_modules; then
            echo "node_modules restored from $store"
            npm run prepare --if-present
            exit 0
          fi
          echo "::warning::could not restore $store; falling back to npm ci"
          rm -rf node_modules
        fi
        npm ci
        staging="$store.$$"
        rm -rf "$staging"
        mkdir -p "$(dirname "$store")"
        if cp -al node_modules "$staging" 2>/dev/null || cp -a node_modules "$staging"; then
          mv -T "$staging" "$store" 2>/dev/null || rm -rf "$staging"
        fi
