name: Hooks
description: Fetches the owner's hooks from agent-hooks' main into $RUNNER_TEMP/agent-hooks, linked at ~/.agents/hooks where his PC keeps them, with the Python they run on, a venv so a tree's setup installs its packages there and not under HOME, and puts its tools on every later step's PATH

inputs:
  client-id:
    required: true
  private-key:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v7

    - id: python-venv
      shell: bash
      run: |
        venv="$RUNNER_TEMP/python"
        python3 -m venv "$venv"
        printf '%s\n' "$venv/bin" >>"$GITHUB_PATH"
        printf 'VIRTUAL_ENV=%s\n' "$venv" >>"$GITHUB_ENV"

    - shell: bash
      run: python3 -m pip install --quiet pyyaml

    - id: hooks-app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: agent-hooks
        permission-contents: read

    - id: hooks-fetch
      shell: bash
      env:
        HOOKS_TOKEN: ${{ steps.hooks-app.outputs.token }}
      run: |
        hooks="$RUNNER_TEMP/agent-hooks"
        attempt=1
        until git clone --quiet --depth 1 --branch main "https://x-access-token:$HOOKS_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/agent-hooks" "$hooks" 2>"$RUNNER_TEMP/agent-hooks-clone.log"; do
          rm -rf "$hooks"
          if [ "$attempt" -ge 3 ]; then
            { printf '%s\n' "A job cannot fetch the owner's hooks after 3 tries"; cat "$RUNNER_TEMP/agent-hooks-clone.log"; } | tee "$RUNNER_TEMP/agent-hooks-unreachable.log" >&2
            exit 1
          fi
          attempt=$((attempt + 1))
        done
        rm -rf "$hooks/.git"

    - id: hooks-install
      shell: bash
      run: |
        hooks="$RUNNER_TEMP/agent-hooks"
        printf '%s\n' "$hooks/bin" >>"$GITHUB_PATH"
        mkdir -p "$HOME/.agents"
        rm -rf "$HOME/.agents/hooks"
        ln -s "$hooks" "$HOME/.agents/hooks"
