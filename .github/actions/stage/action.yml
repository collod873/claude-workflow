name: Stage
description: Readies a job to run stages under the owner's hooks, with a live feed of each transcript

inputs:
  client-id:
    required: true
  private-key:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: npm install --global @anthropic-ai/claude-code

    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - id: hooks-app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: collod873
        repositories: agent-hooks
        permission-contents: read

    - shell: bash
      env:
        HOOKS_TOKEN: ${{ steps.hooks-app.outputs.token }}
      run: |
        hooks="$RUNNER_TEMP/agent-hooks"
        attempt=1
        until git clone --quiet --depth 1 "https://x-access-token:$HOOKS_TOKEN@github.com/collod873/agent-hooks" "$hooks" 2>"$RUNNER_TEMP/agent-hooks-clone.log"; do
          rm -rf "$hooks"
          if [ "$attempt" -ge 3 ]; then
            { printf '%s\n' "A job cannot fetch the owner's hooks after 3 tries"; cat "$RUNNER_TEMP/agent-hooks-clone.log"; } >"$RUNNER_TEMP/agent-hooks-unreachable.log"
            exit 1
          fi
          attempt=$((attempt + 1))
        done
        rm -rf "$hooks/.git"
        mkdir -p "$HOME/bin"
        ln -sf "$hooks/bin/check" "$HOME/bin/check"
        python3 "$hooks/hookcheck.py" --root "$hooks" --settings "$RUNNER_TEMP/unregistered.json" --emit-settings >"$RUNNER_TEMP/agent-hooks.json"
        printf 'AGENT_HOOKS_SETTINGS=%s\n' "$RUNNER_TEMP/agent-hooks.json" >>"$GITHUB_ENV"
        printf 'FEED=%s\n' "$GITHUB_ACTION_PATH/feed.jq" >>"$GITHUB_ENV"

    - id: captures-app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: collod873
        repositories: Knowledge-Base
        permission-contents: read

    - shell: bash
      env:
        CAPTURES_TOKEN: ${{ steps.captures-app.outputs.token }}
      run: |
        knowledge="$RUNNER_TEMP/knowledge-base"
        captures="$RUNNER_TEMP/session-captures"
        mkdir -p "$captures"
        git clone --quiet --depth 1 --filter=blob:none --sparse "https://x-access-token:$CAPTURES_TOKEN@github.com/collod873/Knowledge-Base" "$knowledge"
        git -C "$knowledge" sparse-checkout set raw/sessions
        grep -lE '^project: .*(Workflow|claude-workflow|\.agents)' "$knowledge"/raw/sessions/*.md | xargs -r cp -t "$captures"
        rm -rf "$knowledge"
        printf 'SESSION_CAPTURES=%s\n' "$captures" >>"$GITHUB_ENV"
