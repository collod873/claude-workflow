name: Stage
description: Readies a job to run stages as the owner's own session runs, under his claude-config, hooks and skills, with a live feed of each transcript

inputs:
  client-id:
    required: true
  private-key:
    required: true
  prod-database-url:
    required: false

runs:
  using: composite
  steps:
    - shell: bash
      run: npm install --global @anthropic-ai/claude-code playwright-core@1.64.0

    - uses: ./.github/actions/hooks
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - id: stage-env
      shell: bash
      env:
        PROD_DATABASE_URL: ${{ inputs.prod-database-url }}
      run: |
        printf 'FEED=%s\n' "$GITHUB_ACTION_PATH/feed.jq" >>"$GITHUB_ENV"
        printf 'HOOK_LOG_DIR=%s\n' "$RUNNER_TEMP/hook-logs" >>"$GITHUB_ENV"
        if [[ -n $PROD_DATABASE_URL ]]; then
          printf 'PROD_DATABASE_URL=%s\n' "$PROD_DATABASE_URL" >>"$GITHUB_ENV"
        fi

    - id: skills-app
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: agent-skills
        permission-contents: read

    - shell: bash
      env:
        SKILLS_TOKEN: ${{ steps.skills-app.outputs.token }}
      run: |
        skills="$RUNNER_TEMP/agent-skills"
        if git clone --quiet --depth 1 "https://x-access-token:$SKILLS_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/agent-skills" "$skills"; then
          rm -rf "$skills/.git"
          printf '%s\n' "$skills/bin" >>"$GITHUB_PATH"
        else
          printf '::warning::%s\n' "A job cannot fetch the owner's skills, so its stages run without the owner's skills and bin tools"
        fi

    - id: config-app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: claude-config
        permission-contents: read

    - id: config-fetch
      shell: bash
      env:
        CONFIG_TOKEN: ${{ steps.config-app.outputs.token }}
      run: |
        config="$RUNNER_TEMP/claude-config"
        attempt=1
        until git clone --quiet --depth 1 "https://x-access-token:$CONFIG_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/claude-config" "$config"; do
          rm -rf "$config"
          if [ "$attempt" -ge 3 ]; then
            printf '%s\n' "A job cannot fetch the owner's claude-config after 3 tries" >&2
            exit 1
          fi
          attempt=$((attempt + 1))
        done
        rm -rf "$config/.git" "$config/skills"
        ln -s "$RUNNER_TEMP/agent-skills/skills" "$config/skills"
        mkdir -p "$HOME/.claude/projects"
        ln -s "$HOME/.claude/projects" "$config/projects"
        jq 'del(.hooks) | .env.CLAUDE_CODE_TMPDIR = env.TMPDIR' "$config/settings.json" >"$RUNNER_TEMP/unregistered.json"
        mv "$RUNNER_TEMP/unregistered.json" "$config/settings.json"
        python3 "$RUNNER_TEMP/agent-hooks/hookcheck.py" --root "$RUNNER_TEMP/agent-hooks" --settings "$config/settings.json" --write-settings --graded
        printf 'CLAUDE_CONFIG_DIR=%s\n' "$config" >>"$GITHUB_ENV"

    - id: captures-app
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: transcripts
        permission-contents: read

    - id: captures-fetch
      shell: bash
      continue-on-error: true
      env:
        CAPTURES_TOKEN: ${{ steps.captures-app.outputs.token }}
      run: |
        transcripts="$RUNNER_TEMP/transcripts"
        captures="$RUNNER_TEMP/session-captures"
        mkdir -p "$captures" "$HOME/Claude Projects/transcripts"
        printf 'SESSION_CAPTURES=%s\n' "$captures" >>"$GITHUB_ENV"
        git clone --quiet --depth 1 --filter=blob:none --sparse "https://x-access-token:$CAPTURES_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/transcripts" "$transcripts"
        git -C "$transcripts" sparse-checkout set --no-cone '/*/*/session.md'
        grep -lE '^project: .*(Workflow|claude-workflow|\.agents)' "$transcripts"/*/*/session.md | while read -r page; do
          cp "$page" "$captures/$(basename "$(dirname "$page")").md"
        done
        rm -rf "$transcripts"
