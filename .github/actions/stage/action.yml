name: Stage
description: Readies a job to run stages under the owner's hooks, with a live feed of each transcript

inputs:
  client-id:
    required: true
  private-key:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: npm install --global @anthropic-ai/claude-code

    - uses: ./.github/actions/hooks
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - shell: bash
      run: |
        printf 'FEED=%s\n' "$GITHUB_ACTION_PATH/feed.jq" >>"$GITHUB_ENV"
        printf 'HOOK_LOG_DIR=%s\n' "$RUNNER_TEMP/hook-logs" >>"$GITHUB_ENV"

    - id: skills-app
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: agent-skills
        permission-contents: read

    - shell: bash
      env:
        SKILLS_TOKEN: ${{ steps.skills-app.outputs.token }}
      run: |
        skills="$RUNNER_TEMP/agent-skills"
        if git clone --quiet --depth 1 "https://x-access-token:$SKILLS_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/agent-skills" "$skills"; then
          rm -rf "$skills/.git"
        else
          skills=""
          printf '::warning::%s\n' "A job cannot fetch the owner's skills, so its builder and reviewer run without the testing standard"
        fi
        printf 'AGENT_SKILLS=%s\n' "$skills" >>"$GITHUB_ENV"

    - id: captures-app
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: Knowledge-Base
        permission-contents: read

    - shell: bash
      continue-on-error: true
      env:
        CAPTURES_TOKEN: ${{ steps.captures-app.outputs.token }}
      run: |
        knowledge="$RUNNER_TEMP/knowledge-base"
        captures="$RUNNER_TEMP/session-captures"
        mkdir -p "$captures"
        printf 'SESSION_CAPTURES=%s\n' "$captures" >>"$GITHUB_ENV"
        git clone --quiet --depth 1 --filter=blob:none --sparse "https://x-access-token:$CAPTURES_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/Knowledge-Base" "$knowledge"
        git -C "$knowledge" sparse-checkout set raw/sessions
        grep -lE '^project: .*(Workflow|claude-workflow|\.agents)' "$knowledge"/raw/sessions/*.md | xargs -r cp -t "$captures"
        rm -rf "$knowledge"
