name: Keys
description: Hands a stage each secret the tree's contract names under needs, from the repo's secrets, so the builder and the done check see what the app sees, and names in UNSET_KEYS and the log each one the repo's secrets lack

inputs:
  secrets:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: tree
      env:
        SECRETS: ${{ inputs.secrets }}
      run: |
        named=$(jq -r '.needs[]?' .claude/contract.json 2>/dev/null) || exit 0
        unset_keys=()
        while IFS= read -r name; do
          [[ -n $name ]] || continue
          if value=$(jq -er --arg name "$name" '.[$name] // empty' <<<"$SECRETS"); then
            delimiter="KEY_${RANDOM}${RANDOM}${RANDOM}_END"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >>"$GITHUB_ENV"
          else
            unset_keys+=("$name")
          fi
        done <<<"$named"
        if ((${#unset_keys[@]} > 0)); then
          joined=$(IFS=,; printf '%s' "${unset_keys[*]}")
          printf 'UNSET_KEYS=%s\n' "$joined" >>"$GITHUB_ENV"
          printf '::warning::%s\n' "The contract names keys this repo's secrets lack, so a sentence resting on one goes to the owner: $joined"
        fi
