name: Mark a lane running
description: >
  Puts `running` on the issue a lane is working, and takes it off when the lane stops. This is the
  only thing on the tracker that says a lane is *in flight*: every other label asserts a position
  the work reached and then stayed at, so without this a ticket being implemented right now and a
  ticket nobody has touched render identically on a GitHub issue list, which is where the owner
  actually looks, rather than the Actions tab.

inputs:
  issue:
    description: The issue the lane is working. Empty is a no-op, so a caller may pass a value that
      is only set on one of its triggers.
    required: true
  mode:
    description: "`on` when the lane is starting, `off` when it has stopped for any reason."
    required: true

runs:
  using: composite
  steps:
    - name: Mark the issue
      shell: bash
      env:
        RUNNING_ISSUE: ${{ inputs.issue }}
        RUNNING_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail

        if [ -z "${RUNNING_ISSUE:-}" ]; then
          echo "running-label: no issue number, nothing to mark"
          exit 0
        fi

        if [ "$RUNNING_MODE" = "on" ]; then
          gh issue edit "$RUNNING_ISSUE" --add-label running \
            || echo "::warning::running-label: could not mark #$RUNNING_ISSUE as running"
        else
          gh issue edit "$RUNNING_ISSUE" --remove-label running >/dev/null 2>&1 || true
        fi
