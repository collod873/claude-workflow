name: Needs
description: Readies what the tree's contract says it needs before a stage starts. Postgres starts when a step or the contract's top-level needs names DATABASE_URL, and its address is handed on as DATABASE_URL once it takes connections. Every other name under the top-level needs is a key, handed on from the repo's secrets, and each one the secrets lack is named in UNSET_KEYS and the log, so the builder and the done check see what the app sees

inputs:
  secrets:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: tree
      env:
        SECRETS: ${{ inputs.secrets }}
      run: |
        [[ -f .claude/contract.json ]] || exit 0
        if jq -e 'any((.steps[]?.needs[]?), (.needs[]?); . == "DATABASE_URL")' .claude/contract.json >/dev/null 2>&1; then
          name="database-${GITHUB_REPOSITORY//[^A-Za-z0-9_.-]/-}-${RUNNER_NAME//[^A-Za-z0-9_.-]/-}"
          docker ps --all --quiet --filter "name=^$name\$" | xargs --no-run-if-empty docker rm --force >/dev/null
          docker run --quiet --detach --name "$name" --publish 127.0.0.1::5432 --env POSTGRES_PASSWORD=postgres postgres:16 >/dev/null
          timeout 60 bash -c "until docker exec '$name' pg_isready --quiet --host 127.0.0.1; do sleep 1; done"
          port=$(docker port "$name" 5432/tcp | head -n 1 | sed 's/.*://')
          printf 'DATABASE_URL=%s\n' "postgres://postgres:postgres@localhost:$port/postgres" >>"$GITHUB_ENV"
        fi
        keys=$(jq -r '.needs[]? | select(. != "DATABASE_URL")' .claude/contract.json 2>/dev/null) || exit 0
        unset_keys=()
        while IFS= read -r key; do
          [[ -n $key ]] || continue
          if value=$(jq -er --arg key "$key" '.[$key] // empty' <<<"$SECRETS" 2>/dev/null); then
            delimiter="KEY_${RANDOM}${RANDOM}${RANDOM}_END"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >>"$GITHUB_ENV"
          else
            unset_keys+=("$key")
          fi
        done <<<"$keys"
        if ((${#unset_keys[@]} > 0)); then
          joined=$(IFS=,; printf '%s' "${unset_keys[*]}")
          printf 'UNSET_KEYS=%s\n' "$joined" >>"$GITHUB_ENV"
          printf '::warning::%s\n' "The contract names keys this repo's secrets lack, so the builder is told and a sentence resting on one goes to the owner: $joined"
        fi
