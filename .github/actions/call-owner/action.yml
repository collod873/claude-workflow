name: Call owner
description: Marks an issue with the label spelled STUCK and comments to the owner with the link of the run that ended red, unless it already carries the label spelled PAUSED or STUCK

inputs:
  issue:
    required: true
  run:
    required: true
  token:
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE: ${{ inputs.issue }}
        RAN: ${{ inputs.run }}
      run: |
        paused=$(bin/spelled PAUSED)
        stop=$(bin/spelled STUCK)
        gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -q -x -e "$paused" -e "$stop" && exit 0
        bin/mark "$ISSUE" "$stop" || gh issue edit "$ISSUE" --add-label "$stop"
        gh issue comment "$ISSUE" --body "@${{ github.repository_owner }} $RAN ended red before it could finish, see the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
