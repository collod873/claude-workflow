name: Call owner
description: Leaves a notice titled with the text spelled OWNER_CALL naming the issue and the run that stopped, which bin/rerun reads once the run completes to re-run it once or mark the issue stuck, unless the issue already carries the label spelled PAUSED or STUCK

inputs:
  issue:
    required: true
  run:
    required: true
  token:
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE: ${{ inputs.issue }}
        RAN: ${{ inputs.run }}
      run: |
        paused=$(bin/spelled PAUSED)
        stop=$(bin/spelled STUCK)
        bin/github issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -q -x -e "$paused" -e "$stop" && exit 0
        printf '::notice title=%s::%s %s\n' "$(bin/spelled OWNER_CALL)" "$ISSUE" "$RAN"
