name: Install the target's dependencies
description: >
  Installs whatever `target/` names as its own dependencies, using whichever package manager its
  own lockfile names — never assumed to be npm, and never this machine's `npm ci`
  (`.github/actions/node`), because the target is a separate repository with its own toolchain
  (ADR-0139: an enrolled repository owes only its `.claude/contract.json`, `docs/adr/` and a
  `CODING_STANDARDS.md` — Lumaria's own tree has no `package-lock.json` at all, only a
  `pnpm-lock.yaml`).
inputs:
  working-directory:
    description: The target's checkout, e.g. "target".
    required: true

runs:
  using: composite
  steps:
    - name: Detect the target's package manager and install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        declared="$(node -e '
          try {
            const pkg = JSON.parse(require("fs").readFileSync("package.json", "utf8"));
            const name = (pkg.packageManager ?? "").split("@")[0].trim();
            if (["npm", "pnpm", "yarn", "bun"].includes(name)) process.stdout.write(name);
          } catch {}
        ' 2>/dev/null || true)"

        if [ -n "$declared" ]; then
          pm="$declared"
          echo "package.json#packageManager declares $pm — installing with it"
        elif [ -f pnpm-lock.yaml ]; then
          pm=pnpm
          echo "target carries pnpm-lock.yaml — installing with pnpm"
        elif [ -f yarn.lock ]; then
          pm=yarn
          echo "target carries yarn.lock — installing with yarn"
        elif [ -f bun.lockb ] || [ -f bun.lock ]; then
          pm=bun
          echo "target carries bun.lockb/bun.lock — installing with bun"
        elif [ -f package-lock.json ]; then
          pm=npm
          echo "target carries package-lock.json — installing with npm"
        else
          echo "target carries no recognized lockfile (pnpm-lock.yaml, yarn.lock, bun.lockb/bun.lock, package-lock.json) — nothing to install"
          exit 0
        fi

        case "$pm" in
          pnpm)
            corepack enable
            pnpm install --frozen-lockfile
            ;;
          yarn)
            corepack enable
            yarn install --frozen-lockfile
            ;;
          bun)
            corepack enable
            bun install --frozen-lockfile
            ;;
          npm)
            npm ci
            ;;
        esac
