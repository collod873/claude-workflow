name: Stage logs
description: Files a job's stage captures into the transcripts repo and keeps its machine logs as a run artifact

inputs:
  client-id:
    required: true
  private-key:
    required: true
  artifact:
    default: machine-logs

runs:
  using: composite
  steps:
    - id: transcripts-app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: transcripts
        permission-contents: write

    - if: always()
      continue-on-error: true
      shell: bash
      env:
        TRANSCRIPTS_TOKEN: ${{ steps.transcripts-app.outputs.token }}
      run: |
        OWN_CAPTURE=$(printf '%s' "$RUNNER_TEMP/agent-hooks/capture.py" | sed 's/[][\\.*^$+?(){}|]/\\&/g') timeout 120 bash -c 'while pgrep -f "$OWN_CAPTURE" >/dev/null; do sleep 1; done' || true # quiet: a capture still writing after two minutes is flushed as far as it got
        captured="$HOME/Claude Projects/transcripts"
        months=$(cd "$captured" 2>/dev/null && ls -d [0-9][0-9][0-9][0-9]-[0-9][0-9] 2>/dev/null) || exit 0
        machine=$(bin/spelled MACHINE) || exit 1
        clone="$RUNNER_TEMP/transcripts"
        git clone --quiet --depth 1 "https://x-access-token:$TRANSCRIPTS_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/transcripts" "$clone"
        git -C "$clone" config user.name "$machine"
        git -C "$clone" config user.email "$machine@users.noreply.github.com"
        for month in $months; do cp -r "$captured/$month" "$clone/"; done
        git -C "$clone" add $months
        git -C "$clone" commit --quiet -m "flush: stage captures from $GITHUB_REPOSITORY run $GITHUB_RUN_ID" || exit 0
        for attempt in 1 2 3; do
          git -C "$clone" pull --quiet --rebase origin main && git -C "$clone" push --quiet origin HEAD:main && exit 0
        done
        exit 1

    - if: always()
      continue-on-error: true
      shell: bash
      run: |
        logs=$(cd .git/machine-logs && pwd -P) || exit 0
        if [ -d "$logs/../check/logs" ]; then
          mkdir -p "$logs/check"
          cp -r "$logs/../check/logs/." "$logs/check/"
        fi
        if [ -d "${HOOK_LOG_DIR:-}" ]; then
          mkdir -p "$logs/hooks"
          cp -r "$HOOK_LOG_DIR/." "$logs/hooks/"
        fi

    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: .git/machine-logs
        include-hidden-files: true
