name: Machine
run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.probe && format('Probe ({0}): {1}', inputs.probe_with || 'script', inputs.probe) || inputs.rerun && format('Rerun of run {0}', inputs.rerun) || format('Nothing to run for #{0}', inputs.ticket)) || github.event_name == 'issue_comment' && format('Comment on #{0}: {1}', github.event.issue.number, github.event.issue.title) || format('{0} #{1}: {2}', github.event.action, github.event.issue.number, github.event.issue.title) }}"

"on":
  issue_comment:
    types: [created]
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      ticket:
        required: true
        type: string
      rerun:
        required: false
        type: string
      probe:
        required: false
        type: string
      probe_with:
        required: false
        type: string

jobs:
  tickets:
    uses: collod873/claude-workflow/.github/workflows/tickets.yml@main
    secrets: inherit

  specs:
    uses: collod873/claude-workflow/.github/workflows/specs.yml@main
    secrets: inherit
