name: To-Tickets (caller)

"on":
  repository_dispatch:
    types: [prd-sliceable]

jobs:
  to-tickets:
    uses: collod873/claude-workflow/.github/workflows/to-tickets.yml@main
    # A `uses:` job passes no secret to the reusable workflow unless told to — `to-tickets.yml`
    # spends `CLAUDE_CODE_OAUTH_TOKEN`, so without this its preflight fails closed on every run.
    secrets: inherit
