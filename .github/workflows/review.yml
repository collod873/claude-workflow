name: Review

# Lane 07 — the correctness reviewer (PRD #145, move 7a). Fires on a completed "Verify" run
# (ADR-0036): lint, typecheck, the test suite and lane 04's immutable acceptance tests have
# already run against this diff, so the reviewer never sees a finding a green gate already
# covers — `review.ts`'s own `keepSurvivingFindings` drops those before anything downstream
# reads them.
#
# `types: [completed]`, filtered to a successful conclusion at the job level rather than in the
# trigger: `workflow_run` carries no `conclusion` filter of its own, so the job's `if:` is where
# a failed or cancelled Verify run is turned away — reviewing a diff CI has not actually passed
# would be reviewing against a check that never happened.
#
# No `pull_request` trigger, and no sender gate — PRD #145's "Cross-cutting: who may fire a lane"
# section rules an author gate here is a check that can never fire. `verify.yml` carries no
# `pull_request` trigger after ADR-0054, so a stranger's pull request runs no verification, and
# with no verification there is no "Verify" run for this workflow's own trigger to ever see. The
# only runs this can fire on already passed through that door.

"on":
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  # read: the checkout, at the reviewed run's own head SHA.
  contents: read
  # read: the `workflow_run` payload's own fields are enough for the trigger; nothing here calls
  # the Actions API, but the checkout below still needs contents and the job reads no other scope.
  actions: read
  # write: a surviving finding is filed as an issue against trunk (PRD #145: "its survivors reach
  # the owner as issues, never a notification").
  issues: write

concurrency:
  group: review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  review:
    # Two conditions, and the second is not cosmetic. `verify.yml` fires on `push: main` as well as
    # on an implementer's dispatch, and on the push run `workflow_run.head_sha` *is* trunk's tip —
    # so `origin/main..head_sha` is empty and this lane spent two Opus reviewers and a refuter fleet
    # reading nothing, on every commit the owner pushed himself, out of his personal subscription.
    # Lane 07 reviews an implementation pull request's diff, and the push run is the one Verify run
    # that never has one.
    #
    # Stated as "not the push run" rather than by naming the dispatch event, which is the same
    # condition read off `verify.yml`'s trigger list — `immutable-set.test.ts` holds that list to
    # exactly two doors, a push to `main` and the implementer's dispatch, and `review.test.ts`
    # re-asserts it here, so the two spellings are equivalent by a checked premise rather than by a
    # reader's memory. It is also the
    # honest side to state it from: this workflow is not itself dispatch-triggered, and naming that
    # event here made it read as one to the sweep that requires every dispatch-triggered workflow to
    # filter its own `types:` ([ADR-0090](../../docs/adr/0090-a-repository-dispatch-trigger-names-its-own-event-types-so-a.md), #188).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # `review.ts` refuses to run without it — an unassigned finding notifies nobody — and this
      # workflow never set it, so every run of this lane died at the first line of the reviewer.
      # Spelled the same way `run-watchdog.yml`, `bypass-counter.yml` and
      # `missing-trailer-counter.yml` all spell it.
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Preflight — CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before a stage can run." >&2
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      # `review.ts` reaches `stage.ts`, which resolves the CLI from PATH (`spawn("claude", …)`), and
      # a GitHub-hosted runner has none — so every non-skipped run of this lane died `spawn claude
      # ENOENT` before the first reviewer said anything (#188). Same step, same pin, same reasoning
      # as `shape.yml`, `to-tickets.yml` and `implement.yml`: `npm ci` cannot supply the binary
      # because Claude Code is not a dependency of this project, and ADR-0002 wants a run to come
      # from the checkout alone rather than from whatever was published this month.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Run the correctness reviewer
        run: npx tsx .Workflow/agent-workflows/review/review.ts "origin/main" "${{ github.event.workflow_run.head_sha }}"
