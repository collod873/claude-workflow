name: Review (reusable)

# Lane 07 — the correctness reviewer (PRD #145, move 7a). Fires on a completed "Verify" run
# (ADR-0036): lint, typecheck, the test suite and lane 04's immutable acceptance tests have
# already run against this diff, so the reviewer never sees a finding a green gate already
# covers — `review.ts`'s own `keepSurvivingFindings` drops those before anything downstream
# reads them.
#
# `types: [completed]`, filtered to a successful conclusion at the job level, used to be this
# file's own trigger and its own job `if:` — `workflow_run` carries no `conclusion` filter of its
# own. ADR-0055 (amended by ADR-0132) moved both out of this file: `workflow_run` cannot be
# parameterized through `workflow_call`, so `review-caller.yml` is what actually holds the trigger
# and makes the "was this a passing, non-push run" decision now, before this workflow is ever
# called — a failed or cancelled Verify run, or the push run itself, never reaches this file at
# all. The one fact this workflow still needs from that decision — which SHA to check out and
# review — crosses the boundary as the `head_sha` input below.
#
# No `pull_request` trigger anywhere in this pair, and no sender gate — PRD #145's "Cross-cutting:
# who may fire a lane" section rules an author gate here is a check that can never fire.
# `verify-caller.yml` carries no `pull_request` trigger after ADR-0054, so a stranger's pull
# request runs no verification, and with no verification there is no "Verify" run for
# `review-caller.yml`'s own trigger to ever see. The only runs this can fire on already passed
# through that door.

"on":
  workflow_call:
    inputs:
      # The head SHA of the pull request `review-caller.yml`'s `workflow_run` named — the one fact
      # this workflow needs out of an event it can no longer read directly.
      head_sha:
        type: string
        required: true

permissions:
  # read: the checkout, at the reviewed run's own head SHA.
  contents: read
  # write: a surviving finding is filed as an issue against trunk (PRD #145: "its survivors reach
  # the owner as issues, never a notification").
  issues: write

concurrency:
  group: review-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  review:
    # No `if:` here — `review-caller.yml`'s own job already decided this call should happen at
    # all (conclusion `success`, and not the push run — see that file), so every call that reaches
    # this workflow is one to review.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # `review.ts` refuses to run without it — an unassigned finding notifies nobody — and this
      # workflow never set it, so every run of this lane died at the first line of the reviewer.
      # Spelled the same way `run-watchdog.yml`, `bypass-counter.yml` and
      # `missing-trailer-counter.yml` all spell it.
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Preflight — CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before a stage can run." >&2
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      # `review.ts` reaches `stage.ts`, which resolves the CLI from PATH (`spawn("claude", …)`), and
      # a GitHub-hosted runner has none — so every non-skipped run of this lane died `spawn claude
      # ENOENT` before the first reviewer said anything (#188). Same step, same pin, same reasoning
      # as `shape.yml`, `to-tickets.yml` and `implement.yml`: `npm ci` cannot supply the binary
      # because Claude Code is not a dependency of this project, and ADR-0002 wants a run to come
      # from the checkout alone rather than from whatever was published this month.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Run the correctness reviewer
        run: npx tsx .Workflow/agent-workflows/review/review.ts "origin/main" "${{ inputs.head_sha }}"
