name: Fixer (reusable)

"on":
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ""
      test_dir:
        type: string
        required: true
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: fixer-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  fixer:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
    steps:
      - name: Resolve the pull request that Verify run was judging
        id: target
        run: |
          set -euo pipefail

          if [ -z "${RUN_ID:-}" ]; then
            echo "no Verify run named; nothing to resolve"
            exit 0
          fi

          STATUS=""
          for _ in $(seq 1 30); do
            STATUS=$(gh run view "$RUN_ID" --json status --jq .status)
            if [ "$STATUS" = "completed" ]; then break; fi
            sleep 10
          done
          if [ "$STATUS" != "completed" ]; then
            echo "::error::Verify run $RUN_ID is still \"$STATUS\" after five minutes; its log cannot be read, so no pull request was resolved"
            exit 1
          fi

          JOBS=$(gh run view "$RUN_ID" --json jobs --jq '.jobs')

          GATE_CONCLUSION=$(echo "$JOBS" | jq -r '[.[] | select(.name == "Verify" or (.name | endswith(" / Verify")))][0].conclusion // empty')
          RESOLVE_JOB_ID=$(echo "$JOBS" | jq -r '[.[] | select(.name == "Immutability" or (.name | endswith(" / Immutability")))][0].databaseId // empty')
          if [ -z "$RESOLVE_JOB_ID" ]; then
            echo "run $RUN_ID has no Immutability job; nothing to fix"
            exit 0
          fi

          MODE="model"
          if [ "$GATE_CONCLUSION" != "failure" ]; then
            MODE="escalate"
          fi

          LINE=$(gh run view --job "$RESOLVE_JOB_ID" --log \
            | grep -oE 'judging https://[^ ]+/pull/[0-9]+ on implement/issue-[0-9]+' \
            | tail -1 || true)
          if [ -z "$LINE" ]; then
            echo "run $RUN_ID names no implementation pull request; nothing to fix"
            exit 0
          fi

          URL=${LINE#judging }
          URL=${URL%% on *}
          BRANCH=${LINE##* on }
          PR=${URL##*/}
          ISSUE=${BRANCH#implement/issue-}

          STATE=$(gh pr view "$PR" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "$URL is $STATE; nothing to fix"
            exit 0
          fi

          MARKER="<!-- fixer-run:$RUN_ID -->"
          COMMENTS=$(gh pr view "$PR" --json comments --jq '.comments[].body')
          case "$COMMENTS" in
            *"$MARKER"*)
              echo "run $RUN_ID was already reacted to (see the marker comment on $URL); nothing to do"
              exit 0
              ;;
          esac
          gh pr comment "$PR" --body "$(printf '%s\n%s\n' \
            "$MARKER" \
            "[Verify run $RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID) came back red; the fixer is reacting to it.")"

          if [ "$MODE" = "model" ]; then
            echo "fixing $URL on $BRANCH for #$ISSUE"
            {
              echo "mode=model"
              echo "pr=$PR"
              echo "branch=$BRANCH"
              echo "issue=$ISSUE"
            } >> "$GITHUB_OUTPUT"
          else
            FAILED_NAME=$(echo "$JOBS" | jq -r '[.[] | select(.conclusion == "failure")][0].name // empty')
            FAILED_ID=$(echo "$JOBS" | jq -r '[.[] | select(.conclusion == "failure")][0].databaseId // empty')
            if [ -z "$FAILED_NAME" ]; then
              echo "run $RUN_ID reports no failed job; nothing to fix"
              exit 0
            fi
            ERROR_LINE=$(gh run view --job "$FAILED_ID" --log | grep -m1 -oE '::error::.*' || true)

            echo "escalating $URL (#$ISSUE): $FAILED_NAME failed before the gate ran"
            {
              echo "mode=escalate"
              echo "pr=$PR"
              echo "issue=$ISSUE"
              echo "failed_job=$FAILED_NAME"
            } >> "$GITHUB_OUTPUT"
            {
              echo "error_line<<FIXER_EOF"
              echo "${ERROR_LINE:-(no ::error:: line found in the $FAILED_NAME log)}"
              echo "FIXER_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout machine
        if: steps.target.outputs.mode != ''
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        if: steps.target.outputs.mode == 'model'
        uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Checkout target at trunk to escalate
        if: steps.target.outputs.mode == 'escalate'
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        if: steps.target.outputs.mode == 'model'
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Preflight, CLAUDE_CODE_OAUTH_TOKEN is set
        if: steps.target.outputs.mode == 'model'
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before a stage can run." >&2
            exit 1
          fi

      - name: Set up Node and install dependencies
        if: steps.target.outputs.mode != ''
        uses: ./.github/actions/node

      - name: Install target dependencies
        if: steps.target.outputs.mode == 'model'
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Install Claude Code
        if: steps.target.outputs.mode == 'model'
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Rebase onto trunk so trunk's fixer runs
        id: rebase
        if: steps.target.outputs.mode == 'model'
        env:
          ISSUE: ${{ steps.target.outputs.issue }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: |
          set -euo pipefail
          git -C target fetch origin main
          if ! git -C target rebase origin/main; then
            paths=$(git -C target diff --name-only --diff-filter=U | tr '\n' ' ')
            git -C target rebase --abort
            npx tsx .Workflow/agent-workflows/fixer/fixer.ts escalate "$ISSUE" "$PR_NUMBER" "rebase onto trunk" "conflicts in: $paths"
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the fixer
        if: steps.target.outputs.mode == 'model' && steps.rebase.outputs.conflicted != 'true'
        timeout-minutes: 40
        env:
          ISSUE: ${{ steps.target.outputs.issue }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          BRANCH: ${{ steps.target.outputs.branch }}
          TEST_DIR: ${{ inputs.test_dir }}
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/fixer/fixer.ts "$ISSUE" "$PR_NUMBER" "$BRANCH" "$TEST_DIR"

      - name: Escalate a fixer that died
        if: failure() && steps.target.outputs.mode == 'model'
        env:
          ISSUE: ${{ steps.target.outputs.issue }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: npx tsx .Workflow/agent-workflows/fixer/fixer.ts escalate "$ISSUE" "$PR_NUMBER" "the fixer itself" "the attempt loop crashed or timed out before it could finish"

      - name: Escalate to the owner
        if: steps.target.outputs.mode == 'escalate'
        env:
          ISSUE: ${{ steps.target.outputs.issue }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          FAILED_JOB: ${{ steps.target.outputs.failed_job }}
          ERROR_LINE: ${{ steps.target.outputs.error_line }}
        run: npx tsx .Workflow/agent-workflows/fixer/fixer.ts escalate "$ISSUE" "$PR_NUMBER" "$FAILED_JOB" "$ERROR_LINE"
