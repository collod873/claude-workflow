name: Check

"on":
  pull_request_target:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && exit 0
          printf 'check: a PR from %s is never judged here\n' "${HEAD_REPO:-a deleted fork}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - run: git checkout origin/main -- vitest.config.ts src/growth-limits.proc.test.ts

      - uses: ./.github/actions/hooks
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - run: |
          mkdir -p "$HOME/bin"
          ln -sf "$RUNNER_TEMP/agent-hooks/bin/check" "$HOME/bin/check"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ~/bin/check --full --publish | tee "$RUNNER_TEMP/check.out"

      - id: told
        if: failure() && steps.check.conclusion == 'failure'
        run: |
          log=$(tail -n 1 "$RUNNER_TEMP/check.out" | sed -n 's/.*; log \(.*\)$/\1/p')
          printf 'log=%s\n' "$log" >>"$GITHUB_OUTPUT"
          [ -z "$log" ] || tail -n 60 "$log"

      - if: failure() && steps.told.outputs.log != ''
        uses: actions/upload-artifact@v7
        with:
          name: check-log
          path: ${{ steps.told.outputs.log }}
          include-hidden-files: true

  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: review-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          prefix=$(bin/spelled TICKET_PREFIX)
          held=$(jq --arg prefix "$prefix" '.pull_request.head.ref | startswith($prefix)' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: npm-ci
        if: steps.labelled.outputs.held == 'true'
        run: npm ci

      - id: worktree
        if: steps.labelled.outputs.held == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" origin/main
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/main/node_modules"

      - id: stage
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: git-config
        if: steps.labelled.outputs.held == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - id: review
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 10
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/review-${{ github.event.pull_request.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          $RUNNER_TEMP/main/bin/review ${{ github.event.pull_request.number }}

      - if: always() && steps.labelled.outputs.held != 'false'
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  meters:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          prefix=$(bin/spelled TICKET_PREFIX)
          held=$(jq --arg prefix "$prefix" '.pull_request.head.ref | startswith($prefix)' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: npm-ci
        if: steps.labelled.outputs.held == 'true'
        run: npm ci

      - id: worktree
        if: steps.labelled.outputs.held == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/main" origin/main
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/main/node_modules"

      - id: stage
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: meters
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 10
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/meters-${{ github.event.pull_request.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          $RUNNER_TEMP/main/bin/meters ${{ github.event.pull_request.number }}

      - if: always() && steps.labelled.outputs.held != 'false'
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          artifact: meter-logs
