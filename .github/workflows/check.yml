name: Check

"on":
  pull_request_target:

permissions:
  contents: read

jobs:
  check:
    name: "${{ startsWith(github.head_ref, 'land/') && 'judged on the owner PC before the push (ADR-0008)' || github.event.sender.login == 'collod873-machine[bot]' && !startsWith(github.head_ref, 'enrol/') && 'judged by the machine before its push (#1345)' || 'check' }}"
    if: ${{ !startsWith(github.head_ref, 'land/') && !(github.event.sender.login == 'collod873-machine[bot]' && !startsWith(github.head_ref, 'enrol/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && exit 0
          printf 'check: a PR from %s is never judged here\n' "${HEAD_REPO:-a deleted fork}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - run: git checkout origin/main -- vitest.config.ts src/growth-limits.proc.test.ts

      - uses: ./.github/actions/hooks
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          check --full --publish | tee "$RUNNER_TEMP/check.out"

      - id: told
        if: failure() && steps.check.conclusion == 'failure'
        run: |
          log=$(tail -n 1 "$RUNNER_TEMP/check.out" | sed -n 's/.*; log \(.*\)$/\1/p')
          printf 'log=%s\n' "$log" >>"$GITHUB_OUTPUT"
          [ -z "$log" ] || tail -n 60 "$log"

      - if: failure() && steps.told.outputs.log != ''
        uses: actions/upload-artifact@v7
        with:
          name: check-log
          path: ${{ steps.told.outputs.log }}
          include-hidden-files: true

