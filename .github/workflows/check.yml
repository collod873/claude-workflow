name: Check

"on":
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/check

      - if: failure() && steps.check.conclusion == 'failure'
        run: tail -n 60 "$(git rev-parse --git-common-dir)"/machine-logs/check-*.log
