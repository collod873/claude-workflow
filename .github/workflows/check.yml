name: Check

"on":
  pull_request:
  pull_request_target:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && exit 0
          printf 'check: a PR from %s is never judged here\n' "${HEAD_REPO:-a deleted fork}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - run: git checkout origin/main -- vitest.config.ts src/growth-limits.proc.test.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/check

      - if: failure() && steps.check.conclusion == 'failure'
        run: tail -n 60 "$(git rev-parse --git-common-dir)"/machine-logs/check-*.log

  review:
    needs: check
    if: ${{ !cancelled() && startsWith(github.head_ref, 'ticket/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: |
          git worktree add --detach "$RUNNER_TEMP/main" origin/main
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/main/node_modules"

      - uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - if: needs.check.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: bin/mark "${HEAD_REF#ticket/}" 4-reviewing || true

      - id: review
        if: needs.check.result == 'success'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 10
          HEAD_REF: ${{ github.head_ref }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/review-${{ github.event.pull_request.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          $RUNNER_TEMP/main/bin/review ${{ github.event.pull_request.number }}
          bin/mark "${HEAD_REF#ticket/}" 5-merging || true

      - if: failure() && steps.review.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: bin/mark "${HEAD_REF#ticket/}" failed

      - id: hand-off
        if: (success() && needs.check.result == 'failure') || (failure() && steps.review.outcome == 'failure')
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          CHECKED: ${{ needs.check.result }}
          STAGE_MINUTES: 25
        run: |
          tail --pid=$$ -n +1 -F ".git/machine-logs/fix-${HEAD_REF#ticket/}.jsonl" 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          gh issue view "${HEAD_REF#ticket/}" --json labels --jq '.labels[].name' | grep -qx fixing && exit 0
          row='The reviewer finds drift from `## Why`'
          [[ $CHECKED == success ]] || row="Green on the ticket's checks, red on the PR's required check"
          node src/hand-off.ts "${HEAD_REF#ticket/}" "$row"

      - if: cancelled() || steps.hand-off.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: bin/mark "${HEAD_REF#ticket/}" failed

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
