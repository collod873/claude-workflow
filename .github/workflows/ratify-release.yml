name: Ratify release (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  pull-requests: read

jobs:
  ratify-release:
    if: github.event.action == 'ratifier-merged'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      PR: ${{ github.event.client_payload.pr }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Fetch the ratifications ref
        working-directory: target
        run: git fetch origin '+refs/notes/ratifications:refs/notes/ratifications' || true

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Record what this batch ratified
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/observations/run-ratification.ts
