name: Run watchdog (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: run-watchdog
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.action == 'session-captured'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      EVENT_ACTION: ${{ github.event.action }}
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Sweep for lanes that executed nothing
        run: npx tsx .Workflow/agent-workflows/watchdog/run-watchdog.ts
