name: Dispatch reconcile

"on":
  repository_dispatch:
    types: [session-captured, graph-changed, run-ended]
  issues:
    types: [labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reconcile:
    permissions:
      contents: write
      issues: write
      actions: read
      pull-requests: read
    uses: collod873/claude-workflow/.github/workflows/dispatch-reconcile.yml@main
    with:
      verify_workflow: verify-caller.yml
