name: Recover

"on":
  workflow_run:
    workflows: ["Implement"]
    types: [completed]
  repository_dispatch:
    types: [implement-failed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "A completed Implement run to react to. Empty resolves no ticket and exits."
        required: false
        default: ""

jobs:
  recover:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'implement-failed' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    uses: collod873/claude-workflow/.github/workflows/recover.yml@main
    with:
      run_id: ${{ github.event.workflow_run.id || github.event.client_payload.run_id || github.event.inputs.run_id }}
