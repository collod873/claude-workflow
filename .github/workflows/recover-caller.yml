name: Recover

# Not "six lines with nothing in them" the way `verify-caller.yml` is (ADR-0055, amended by
# ADR-0132): `workflow_run` cannot be parameterized through `workflow_call`, so the routing
# decision `recover.yml`'s own job `if:` used to make — which of its three doors fired, and
# whether the run behind it is one worth reacting to — has to live here now. Only the run id it
# resolves crosses into the reusable workflow, as a `workflow_call` input; `recover.yml`'s own
# header carries the rest of the reasoning this file used to carry directly.

"on":
  workflow_run:
    workflows: ["Implement"]
    types: [completed]
  # The door lane 05 rings itself, from its own `if: failure()` step — see `implement.yml` for why
  # `workflow_run` alone was not enough. `types:` names this lane's one action (ADR-0090).
  repository_dispatch:
    types: [implement-failed]
  # The hand door. A `workflow_run` trigger cannot be fired by a person — no way to react to a
  # failed run from before this file existed, no way to retry one after the cause was dealt with
  # by hand, no way to find out whether this lane runs at all short of waiting for a real failure.
  workflow_dispatch:
    inputs:
      run_id:
        description: "A completed Implement run to react to. Empty resolves no ticket and exits."
        required: false
        default: ""

jobs:
  recover:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    # The same union `recover.yml`'s job `if:` carried before the split, plus `cancelled` — this
    # door excluded a timed-out run for the same reason lane 05's own dispatch step did, so both
    # halves of the pair missed the one death they most needed to catch (#342, run 33687023105).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'implement-failed' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    uses: collod873/claude-workflow/.github/workflows/recover.yml@main
    with:
      # The same `||` chain `recover.yml`'s own `RUN_ID` used to resolve directly — whichever of
      # the three doors fired is the one with a value here.
      run_id: ${{ github.event.workflow_run.id || github.event.client_payload.run_id || github.event.inputs.run_id }}
    # No `secrets: inherit` — `recover.yml` installs no Claude CLI and binds no OAuth secret; it
    # never runs a model (see that file's header).
