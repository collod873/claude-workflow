name: Walk home

"on":
  repository_dispatch:
    types: [session-captured]

permissions:
  contents: read
  issues: write

concurrency:
  group: walk-home
  cancel-in-progress: false

jobs:
  walk:
    if: github.event.action == 'session-captured'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVENT_ACTION: ${{ github.event.action }}
      GH_TOKEN: ${{ secrets.ENROL_PAT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Walk red runs home
        run: npx tsx .Workflow/agent-workflows/watchdog/walk-home.ts
