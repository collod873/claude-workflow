name: Missing-trailer counter (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: missing-trailer-counter
  cancel-in-progress: false

jobs:
  count:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Count missing trailers
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/watchdog/missing-trailer-counter.ts
