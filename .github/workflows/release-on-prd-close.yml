name: Release on PRD close

# Spec #63 §Solution move 4/5, the PRD-close connector. `run-release.ts`'s `runRelease` already
# holds the entire release decision (reads `refs/release/last` as `base`, evaluates
# `computeReleaseScope` with `prdClosed: true`, opens the PR when it fires) — this workflow exists
# only to call into that seam at the one venue that can see a PRD close at all.
#
# The job-level `if` is the scope rule: only a close marked `completed` claims a PRD was
# delivered, and only an issue still carrying the `prd` label (`to-tickets.yml`'s own trigger
# label) is a PRD in the first place. Both conditions are spelled here as well as in
# `release-on-prd-close.ts`'s `CLOSE_STATE_REASON`/`PRD_LABEL` on purpose — the estate is over its
# 2,000-minute cap, so a job that would decide "nothing to do" should never start — and
# `release-on-prd-close.test.ts` asserts the two still agree, since no compiler sees across this
# language boundary. The same scope rule `.claude/hooks/close-gate.py` holds for a ticket
# (ADR-0013), spelled here for a PRD.
#
# `GITHUB_SHA` is the head this run scopes its release through: for an `issues` event it is the
# default branch's own tip, which is exactly the range `computeReleaseScope` should read — no
# extra `git rev-parse` needed. The connector makes no model call (`release.ts`'s `composeRelease`
# only ever calls `gh pr create`), so there is no `CLAUDE_CODE_OAUTH_TOKEN` preflight here the way
# `to-tickets.yml` needs one.

"on":
  issues:
    types: [closed]

permissions:
  # write: pushing the advanced `refs/release/last` back to origin (see the last step below).
  contents: write
  issues: read
  pull-requests: write

# One release decision per PRD at a time. A PRD can be closed, reopened and closed again — an
# ordinary correction — and each close fires this connector afresh; two of them running side by
# side both read `refs/release/last` before either advances it, so both scope the same range and
# both open a release pull request for it. Keyed per PRD rather than fixed, because two different
# PRDs closing in the same minute are two genuinely separate decisions.
#
# Cancelling would be wrong here for a reason of its own: the run makes no model call, but it does
# push an advanced `refs/release/last` at the very end, and a run killed between `gh pr create` and
# that push leaves an open release PR whose range the next run would scope again from the old ref.
concurrency:
  group: release-on-prd-close-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  release-on-prd-close:
    if: github.event.issue.state_reason == 'completed' && contains(github.event.issue.labels.*.name, 'prd')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      STATE_REASON: ${{ github.event.issue.state_reason }}
      LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
      # The branch a release PR merges into (#219) — passed explicitly rather than leaving `--base`
      # to `gh`'s own default-branch resolution, which `release-on-prd-close.ts` also falls back to
      # for a local run where this variable is unset.
      PR_BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `runRelease` walks the commit range and reads `refs/release/last` and the observations/
          # ratifications notes, none of which a shallow, single-branch checkout carries.
          fetch-depth: 0

      # `checkout`'s default refspec is `refs/heads/*` alone, so none of the three refs
      # `runRelease` reads directly off the local repo arrive with it. Each fetch is let fail: a
      # repo with no release yet has no `refs/release/last`, and a repo before its first
      # observation has neither notes ref — the same absence `syncNotesRef`
      # (`shared/notes-sync.ts`) checks for with `ls-remote` before it ever fetches one.
      - name: Fetch release-scope refs
        run: |
          git fetch origin '+refs/notes/observations:refs/notes/observations' || true
          git fetch origin '+refs/notes/ratifications:refs/notes/ratifications' || true
          git fetch origin '+refs/release/last:refs/release/last' || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # The connector does its own write — at most one `gh pr create`, inside `runRelease` — through
      # the `gh`/`git` seams in `shared/gh.ts`/`shared/git.ts`, so there is no separate reporting
      # step here.
      - name: Release on PRD close
        run: npx tsx .Workflow/agent-workflows/observations/release-on-prd-close.ts

      # `runRelease`'s own `advanceLastReleaseRef` only ever runs `update-ref` on this checkout —
      # it never pushes, the same way `composeRelease` never pushes a branch. Without this, the
      # advance a successful run makes lives only in this job's ephemeral runner and the next PRD
      # close would scope from the repo root again. A ref that never moved (no PR opened, or
      # nothing has ever released) pushes as a no-op; `if: success()` is the default, so a failed
      # release step never publishes a ref it did not actually advance.
      - name: Publish the advanced release ref
        run: |
          if git rev-parse --verify --quiet refs/release/last >/dev/null; then
            git push origin refs/release/last
          fi
