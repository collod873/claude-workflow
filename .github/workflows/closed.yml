name: Closed
run-name: "Strip the labels of #${{ github.event.issue.number || github.event.pull_request.number }}"

"on":
  issues:
    types: [closed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  strip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: bin/mark "$NUMBER" --closed
