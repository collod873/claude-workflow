name: Verify

# The Actions venue of the gauntlet (ADR-0010). It refuses nothing — it runs after the
# push has landed on the ref, and this repo has no branch protection — so it remains telemetry:
# chain of custody that typecheck, lint and test actually ran, made observable by a non-agent on a
# commit anyone can point at. It stays that way: branch protection is declined (ADR-0071).
#
# What it covers changed when the free venues landed. In-turn, turn-end and pre-push now run the
# same three checks before a commit exists, so this venue's job narrowed to the one thing they
# cannot see: a push that skipped them — `--no-verify`, a clone where `npm ci` never ran, or a
# commit made outside a Claude Code session. Its triggers are narrowed to match.
#
# `paths-ignore` is the other half. The four commits before this one were pure Markdown and each
# spent ~23s of a 2,000-minute monthly cap that the estate is already over. Nothing in a `.md` file
# can fail typecheck, lint or the suite, so nothing in one is worth a runner.
#
# `push` is `main` only. Once lane 05 opens pull requests, a branch push would otherwise fire this
# twice — once as `push`, once as `pull_request` — for one commit.
#
# Node arrives pinned to 24, with `npm ci` installing exactly what's in `package-lock.json`,
# matching the block already in `.github/workflows/to-tickets.yml`. `npm ci` also runs `prepare`,
# which installs the husky hooks on the runner, so an agent committing here meets the same pre-push
# gate the owner does.
#
# `repository_dispatch` is added additively, alongside `push` and `pull_request` rather than in
# place of either — lane 05's implementer does not exist yet (PRD #145's own out-of-scope list),
# so nothing sends this dispatch today. What can already be built is the receiving end: the
# Immutability job below, which ADR-0053 and ADR-0054 both require run from trunk's copy of this
# file, which only a dispatch-fired run guarantees (a `pull_request` run executes the PR's own
# copy, and an implementer that deletes this job from its own branch would otherwise go green in
# silence). Left unfiltered by `types:` for the reason `close-gate-reconcile.yml` gives: the filter
# is per-workflow, not per-job, so a future sibling job riding this same trigger would force this
# list to track every action any of them ever adds. The job-level `if:` below is the scope rule.

"on":
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  repository_dispatch:

permissions:
  contents: read

jobs:
  # The alarm half of ADR-0053/ADR-0054's immutable set: `tests/acceptance/`, `vitest.config.ts`
  # and `.github/` may never change in a pull request, because each is a way to silence a check
  # without anyone reading a diff that says so. Runs before `verify` (below) via `needs:`, because
  # a diff that already crosses the immutable set has invalidated whatever the gauntlet would say
  # about it — no sense spending that run.
  #
  # Deliberately no checkout, no Node, no `npm ci`: the whole check is a string comparison against
  # the changed-files list the dispatch already carries, and a refusal (CONTEXT.md) is supposed to
  # be cheap. `IMMUTABLE_SET` below is spelled identically to the array of the same name in
  # `.Workflow/agent-workflows/shared/immutable-set.ts` — `immutable-set.test.ts` asserts the two
  # never drift apart.
  immutability:
    name: Immutability
    if: github.event.action == 'implementation-pr-opened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMMUTABLE_SET: "tests/acceptance/,vitest.config.ts,.github/"
      CHANGED_FILES: ${{ github.event.client_payload.changed_files }}
    steps:
      # Refuses rather than skips when the changed-files input is missing or empty (never
      # `continue-on-error`) — an implementer's dispatch that omits it is not "nothing to check",
      # it is a broken guarantee, and a broken guarantee must read as red, not as green-by-absence.
      - name: Refuse a change to the immutable set
        run: |
          set -euo pipefail

          if [ -z "${CHANGED_FILES:-}" ]; then
            echo "::error::changed-files input is missing or empty; refusing"
            exit 1
          fi

          IFS=',' read -r -a immutable_entries <<< "$IMMUTABLE_SET"
          IFS=',' read -r -a changed_files <<< "$CHANGED_FILES"

          for file in "${changed_files[@]}"; do
            for entry in "${immutable_entries[@]}"; do
              case "$file" in
                "$entry"*)
                  echo "::error::$file touches the immutable set ($entry)"
                  exit 1
                  ;;
              esac
            done
          done

          echo "no changed file touches the immutable set"

  verify:
    needs: [immutability]
    # `immutability` only runs on the dispatch it gates on (above); on `push` and `pull_request` it
    # is skipped, and a skipped dependency is not a success, so this job would otherwise skip with
    # it. `always()` overrides that; `!= 'failure'` still blocks this job when the immutable set
    # was actually crossed.
    if: always() && needs.immutability.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The one check that does not go through `bin/gauntlet`, deliberately: it needs a binary the
      # free venues would have to download on every clone, and C4 says a mechanism that needs a
      # ritual dies by month three. It earns the exception because it is the only venue that can
      # catch a workflow file GitHub itself will refuse to parse — the failure in #40, where
      # `runner.temp` in a job `env` block made `to-tickets.yml` unreadable, its `on:` trigger
      # unarmed, and thirteen pushes fail with zero jobs and no reader. Runs before Node so an
      # unparseable workflow costs nothing else.
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # The same three checks the free venues run, through the same entry point, so a check cannot
      # drift between venues by being spelled differently in two files.
      #
      # `bin/gauntlet push` exits 1 for a real finding and 2 for a gauntlet that could not run at
      # all (bin/gauntlet:20-23) — a distinction a single failing step throws away, leaving a reader
      # to open the log to tell "a check failed" from "the checks are broken". `set +e` keeps this
      # step itself green so the code reaches $GITHUB_OUTPUT; the two steps below fail the run, each
      # under the name that matches what happened.
      - name: Run gauntlet
        id: run-gauntlet
        run: |
          set +e
          bin/gauntlet push
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Gauntlet
        if: steps.run-gauntlet.outputs.exit_code == '1'
        run: exit 1

      - name: Gauntlet could not run
        if: steps.run-gauntlet.outputs.exit_code == '2'
        run: exit 1
