name: Verify

# The Actions venue of the gauntlet (ADR-0010). It refuses nothing — it runs after the
# push has landed on the ref, and this repo has no branch protection — so it remains telemetry:
# chain of custody that typecheck, lint and test actually ran, made observable by a non-agent on a
# commit anyone can point at. It stays that way: branch protection is declined (ADR-0071).
#
# What it covers changed when the free venues landed. In-turn, turn-end and pre-push now run the
# same three checks before a commit exists, so this venue's job narrowed to the one thing they
# cannot see: a push that skipped them — `--no-verify`, a clone where `npm ci` never ran, or a
# commit made outside a Claude Code session. Its triggers are narrowed to match.
#
# `paths-ignore` is the other half. The four commits before this one were pure Markdown and each
# spent ~23s of a 2,000-minute monthly cap that the estate is already over. Nothing in a `.md` file
# can fail typecheck, lint or the suite, so nothing in one is worth a runner.
#
# `push` is `main` only. Once lane 05 opens pull requests, a branch push would otherwise fire this
# twice — once as `push`, once as `pull_request` — for one commit.
#
# Node arrives pinned to 24, with `npm ci` installing exactly what's in `package-lock.json`,
# matching the block already in `.github/workflows/to-tickets.yml`. `npm ci` also runs `prepare`,
# which installs the husky hooks on the runner, so an agent committing here meets the same pre-push
# gate the owner does.

"on":
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The one check that does not go through `bin/gauntlet`, deliberately: it needs a binary the
      # free venues would have to download on every clone, and C4 says a mechanism that needs a
      # ritual dies by month three. It earns the exception because it is the only venue that can
      # catch a workflow file GitHub itself will refuse to parse — the failure in #40, where
      # `runner.temp` in a job `env` block made `to-tickets.yml` unreadable, its `on:` trigger
      # unarmed, and thirteen pushes fail with zero jobs and no reader. Runs before Node so an
      # unparseable workflow costs nothing else.
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # The same three checks the free venues run, through the same entry point, so a check cannot
      # drift between venues by being spelled differently in two files.
      #
      # `bin/gauntlet push` exits 1 for a real finding and 2 for a gauntlet that could not run at
      # all (bin/gauntlet:20-23) — a distinction a single failing step throws away, leaving a reader
      # to open the log to tell "a check failed" from "the checks are broken". `set +e` keeps this
      # step itself green so the code reaches $GITHUB_OUTPUT; the two steps below fail the run, each
      # under the name that matches what happened.
      - name: Run gauntlet
        id: run-gauntlet
        run: |
          set +e
          bin/gauntlet push
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Gauntlet
        if: steps.run-gauntlet.outputs.exit_code == '1'
        run: exit 1

      - name: Gauntlet could not run
        if: steps.run-gauntlet.outputs.exit_code == '2'
        run: exit 1
