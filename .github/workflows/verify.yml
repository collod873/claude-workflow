name: Verify (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.event.client_payload.pr || github.sha }}
  cancel-in-progress: false

jobs:
  immutability:
    name: Immutability
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    env:
      EVENT_ACTION: ${{ github.event.action }}
      CHANGED_FILES: ${{ github.event.client_payload.changed_files }}
      PR: ${{ github.event.client_payload.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Refuse a change to the immutable set
        run: npx tsx .Workflow/agent-workflows/integrate/immutability.ts

  verify:
    name: Verify
    needs: [immutability]
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      IMMUTABILITY_RESULT: ${{ needs.immutability.result }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Gauntlet
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/integrate/gate.ts

  signal-fixer:
    name: Signal the fixer
    needs: [immutability, verify]
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SIGNAL: fixer
      EVENT_ACTION: ${{ github.event.action }}
      IMMUTABILITY_RESULT: ${{ needs.immutability.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      PR: ${{ github.event.client_payload.pr }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Tell the Fixer this run went red
        run: npx tsx .Workflow/agent-workflows/integrate/signal.ts

  signal-review:
    name: Signal the reviewer
    needs: [immutability, verify]
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    env:
      SIGNAL: review
      EVENT_ACTION: ${{ github.event.action }}
      IMMUTABILITY_RESULT: ${{ needs.immutability.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      PR: ${{ github.event.client_payload.pr }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Tell Review this run went green, naming the commits it judged
        run: npx tsx .Workflow/agent-workflows/integrate/signal.ts
