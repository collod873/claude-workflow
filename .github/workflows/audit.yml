name: Audit (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.action == 'session-captured'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.client_payload.head }}
      EVENT_ACTION: ${{ github.event.action }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KNOWLEDGE_BASE_DEPLOY_KEY: ${{ secrets.KNOWLEDGE_BASE_DEPLOY_KEY }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Preflight, KNOWLEDGE_BASE_DEPLOY_KEY is set
        run: |
          set -euo pipefail
          if [ -z "${KNOWLEDGE_BASE_DEPLOY_KEY:-}" ]; then
            echo "KNOWLEDGE_BASE_DEPLOY_KEY is empty: set the repository secret before the corpus checkout can run." >&2
            exit 1
          fi

      - name: Checkout Knowledge-Base
        uses: actions/checkout@v4
        with:
          repository: collod873/Knowledge-Base
          ssh-key: ${{ secrets.KNOWLEDGE_BASE_DEPLOY_KEY }}
          path: target/knowledge-base

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Run the audit
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/observations/run-audit.ts
