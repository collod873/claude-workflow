name: Specs

"on":
  workflow_call:

permissions: {}

jobs:
  wake:
    if: ${{ github.event_name == 'issues' && ((github.event.action == 'labeled' && (github.event.sender.login == github.repository_owner || github.event.sender.login == 'collod873-machine[bot]')) || (github.event.action == 'unlabeled' && github.event.sender.login == github.repository_owner)) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      spec: ${{ steps.labelled.outputs.spec }}
      research: ${{ steps.labelled.outputs.research }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          spec=$(bin/spelled SPEC)
          research=$(bin/spelled RESEARCH)
          paused=$(bin/spelled PAUSED)
          stuck=$(bin/spelled STUCK)
          jq -r --arg SPEC "$spec" --arg RESEARCH "$research" --arg PAUSED "$paused" --arg STUCK "$stuck" '
            (.issue.state != "closed") as $open
            | (any(.issue.labels[]?.name; IN($PAUSED, $STUCK)) | not) as $free
            | "spec=\(any(.issue.labels[]?.name; . == $SPEC) and $open and $free and ((.action == "labeled" and .label.name == $SPEC) or (.action == "unlabeled" and (.label.name | IN($PAUSED, $STUCK)))))",
              "research=\(any(.issue.labels[]?.name; . == $RESEARCH) and $open and ((.action == "labeled" and .label.name == $RESEARCH) or (.action == "unlabeled" and (.label.name | IN($PAUSED, $STUCK)) and $free)))"
          ' "$GITHUB_EVENT_PATH" | tee -a "$GITHUB_OUTPUT"

      - if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ github.event.issue.number }}
          run: the wake run
          token: ${{ steps.app.outputs.token }}

  spec:
    needs: wake
    if: ${{ needs.wake.outputs.spec == 'true' }}
    concurrency:
      group: spec-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 1440
    cache-mode: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pinned
        uses: ./.github/actions/pinned

      - id: npm-ci
        run: npm ci

      - id: database
        uses: ./.github/actions/database

      - id: logs
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          prod-database-url: ${{ secrets.PROD_DATABASE_URL }}

      - id: git-config
        working-directory: tree
        run: |
          git config user.name "core-app[bot]"
          git config user.email "core-app[bot]@users.noreply.github.com"

      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/slice-builder
          key: spec-${{ github.event.issue.number }}-${{ github.run_id }}
          restore-keys: spec-${{ github.event.issue.number }}-

      - id: app-key
        env:
          CLIENT_ID: ${{ vars.CORE_APP_CLIENT_ID }}
          KEY: ${{ secrets.CORE_APP_PRIVATE_KEY }}
        run: |
          umask 077
          jq -n --arg clientId "$CLIENT_ID" --arg key "$KEY" '{$clientId, $key}' >"$RUNNER_TEMP/app-key.json"

      - id: schedule
        timeout-minutes: 1420
        working-directory: tree
        env:
          APP_KEY_FILE: ${{ runner.temp }}/app-key.json
          GH_TOKEN: ${{ steps.app.outputs.token }}
          QUIET_GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -q -n +1 -F .git/machine-logs/slice-${{ github.event.issue.number }}.jsonl .git/machine-logs/done-check-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/schedule" ${{ github.event.issue.number }}

      - if: always() && steps.schedule.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/slice-builder
          key: spec-${{ github.event.issue.number }}-${{ github.run_id }}

      - id: after-schedule-app
        if: always() && steps.schedule.outcome != 'skipped'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ github.event.issue.number }}
          run: the spec run
          token: ${{ steps.after-schedule-app.outputs.token || steps.app.outputs.token }}

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  research:
    needs: wake
    if: ${{ needs.wake.outputs.research == 'true' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: npm-ci
        run: npm ci

      - id: logs
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          prod-database-url: ${{ secrets.PROD_DATABASE_URL }}

      - id: sources
        timeout-minutes: 6
        shell: bash
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEWEST_RUNS: 150
          NEWEST_LOGS: 50
        run: |
          sources="$RUNNER_TEMP/research-sources"
          mkdir -p "$sources/machine-logs" "$sources/sessions"
          git log --date=short --format='commit %h %ad %s' --name-status >"$sources/git-log.txt"
          "$GITHUB_WORKSPACE/bin/github" run list --limit 1000 --json databaseId,workflowName,displayTitle,event,headBranch,conclusion,createdAt,url | jq -c '.[]' >"$sources/runs.jsonl"
          head -n "$NEWEST_RUNS" "$sources/runs.jsonl" | jq -r .databaseId | while read -r run; do
            "$GITHUB_WORKSPACE/bin/github" api "repos/$GH_REPO/actions/runs/$run/jobs" --jq ".jobs[] | {run: $run, job: .name, conclusion, steps: [.steps[] | {name, conclusion}]}"
          done >"$sources/jobs.jsonl"
          "$GITHUB_WORKSPACE/bin/github" api "repos/$GH_REPO/actions/artifacts?per_page=$NEWEST_LOGS" --jq '.artifacts[] | select(.expired | not) | "\(.id) \(.workflow_run.id) \(.name)"' | while read -r id run kept; do
            "$GITHUB_WORKSPACE/bin/github" api "repos/$GH_REPO/actions/artifacts/$id/zip" >"$sources/machine-logs/$id.zip"
            python3 -m zipfile -e "$sources/machine-logs/$id.zip" "$sources/machine-logs/$run-$kept-$id"
            rm "$sources/machine-logs/$id.zip"
          done
          cp -r "$SESSION_CAPTURES/." "$sources/sessions"
          printf 'RESEARCH_SOURCES=%s\n' "$sources" >>"$GITHUB_ENV"

      - id: research
        timeout-minutes: 42
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 40
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/research-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/research" ${{ github.event.issue.number }}

      - if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ github.event.issue.number }}
          run: the research run
          token: ${{ steps.app.outputs.token }}

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  dispatch-rerun:
    needs: [wake, spec, research]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          CALLED_FROM: ${{ github.workflow_ref }}
          TICKET: ${{ github.event.issue.number || github.event.inputs.ticket }}
        run: bin/rerun --dispatch "$RUN" "$ATTEMPT"
