name: Specs

"on":
  workflow_call:

permissions: {}

jobs:
  slice:
    if: ${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.sender.login == github.repository_owner }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          spec=$(bin/spelled SPEC)
          held=$(jq --arg SPEC "$spec" 'any(.issue.labels[]?.name; . == $SPEC)' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: checkout
        if: steps.labelled.outputs.held == 'true'
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: pinned
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/pinned

      - id: npm-ci
        if: steps.labelled.outputs.held == 'true'
        run: npm ci

      - id: logs
        if: steps.labelled.outputs.held == 'true'
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: slice
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 50
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/slice-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/slice" ${{ github.event.issue.number }}

      - if: ${{ steps.labelled.outputs.held != 'false' && (failure() || cancelled()) }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ github.event.issue.number }}
          run: the slice run
          token: ${{ steps.app.outputs.token }}

      - if: always() && steps.labelled.outputs.held != 'false'
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  ended:
    if: ${{ github.event_name == 'issues' && github.event.action == 'closed' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      spec: ${{ steps.ended.outputs.spec }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          spec=$(bin/spelled SPEC)
          note=$(bin/spelled NOTE)
          held=$(jq --arg SPEC "$spec" --arg NOTE "$note" 'any(.issue.labels[]?.name; IN($SPEC, $NOTE)) | not' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: ended
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: bin/slice --ended "$ISSUE" >>"$GITHUB_OUTPUT"

  reslice:
    needs: ended
    if: ${{ needs.ended.outputs.spec != '' }}
    concurrency:
      group: reslice-${{ needs.ended.outputs.spec }}
      cancel-in-progress: false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 160
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pinned
        uses: ./.github/actions/pinned

      - id: npm-ci
        run: npm ci

      - id: logs
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: ended
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: bin/slice --ended "$ISSUE" >>"$GITHUB_OUTPUT"

      - id: wave-check
        if: steps.ended.outputs.spec != '' && steps.ended.outputs.moves != ''
        timeout-minutes: 50
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/done-check-${{ steps.ended.outputs.spec }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/done-check" ${{ steps.ended.outputs.spec }} --wave ${{ steps.ended.outputs.moves }}

      - id: reslice
        if: steps.ended.outputs.spec != ''
        timeout-minutes: 100
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -q -n +1 -F .git/machine-logs/slice-${{ steps.ended.outputs.spec }}.jsonl .git/machine-logs/done-check-${{ steps.ended.outputs.spec }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/slice" ${{ steps.ended.outputs.spec }}

      - if: ${{ (failure() || cancelled()) && steps.ended.outputs.spec != '' }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ steps.ended.outputs.spec }}
          run: the wave check or reslice run
          token: ${{ steps.app.outputs.token }}

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  size-trial:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.trial_cap && !github.event.inputs.rerun }}
    concurrency:
      group: size-trial-${{ github.event.inputs.ticket }}
      cancel-in-progress: false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 160
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pinned
        uses: ./.github/actions/pinned

      - id: npm-ci
        run: npm ci

      - id: logs
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: size-trial
        timeout-minutes: 100
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
          SPEC: ${{ github.event.inputs.ticket }}
          TRIAL_CAP: ${{ github.event.inputs.trial_cap }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/slice-${{ github.event.inputs.ticket }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/slice" --size-trial "$SPEC" "$TRIAL_CAP"

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  resumed:
    if: ${{ github.event_name == 'issues' && github.event.action == 'unlabeled' && github.event.sender.login == github.repository_owner }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      spec: ${{ steps.resumed.outputs.spec }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          spec=$(bin/spelled SPEC)
          paused=$(bin/spelled PAUSED)
          stuck=$(bin/spelled STUCK)
          held=$(jq --arg SPEC "$spec" --arg PAUSED "$paused" --arg STUCK "$stuck" '(.label.name | IN($PAUSED, $STUCK)) and any(.issue.labels[]?.name; . == $SPEC) and (any(.issue.labels[]?.name; IN($PAUSED, $STUCK)) | not)' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: resumed
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: bin/slice --resumed "$ISSUE" >>"$GITHUB_OUTPUT"

  resume:
    needs: resumed
    if: ${{ needs.resumed.outputs.spec != '' }}
    concurrency:
      group: reslice-${{ needs.resumed.outputs.spec }}
      cancel-in-progress: false
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 160
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pinned
        uses: ./.github/actions/pinned

      - id: npm-ci
        run: npm ci

      - id: logs
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: resumed
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: bin/slice --resumed "$ISSUE" >>"$GITHUB_OUTPUT"

      - id: wave-check
        if: steps.resumed.outputs.spec != '' && steps.resumed.outputs.moves != ''
        timeout-minutes: 50
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/done-check-${{ steps.resumed.outputs.spec }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/done-check" ${{ steps.resumed.outputs.spec }} --wave ${{ steps.resumed.outputs.moves }}

      - id: reslice
        if: steps.resumed.outputs.spec != ''
        timeout-minutes: 100
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -q -n +1 -F .git/machine-logs/slice-${{ steps.resumed.outputs.spec }}.jsonl .git/machine-logs/done-check-${{ steps.resumed.outputs.spec }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/slice" ${{ steps.resumed.outputs.spec }}

      - if: ${{ (failure() || cancelled()) && steps.resumed.outputs.spec != '' }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ steps.resumed.outputs.spec }}
          run: the wave check or reslice run
          token: ${{ steps.app.outputs.token }}

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  research:
    if: ${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.sender.login == github.repository_owner }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          research=$(bin/spelled RESEARCH)
          held=$(jq --arg RESEARCH "$research" 'any(.issue.labels[]?.name; . == $RESEARCH)' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: checkout
        if: steps.labelled.outputs.held == 'true'
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: npm-ci
        if: steps.labelled.outputs.held == 'true'
        run: npm ci

      - id: logs
        if: steps.labelled.outputs.held == 'true'
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: sources
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 6
        shell: bash
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEWEST_RUNS: 150
          NEWEST_LOGS: 50
        run: |
          sources="$RUNNER_TEMP/research-sources"
          mkdir -p "$sources/machine-logs" "$sources/sessions"
          git log --date=short --format='commit %h %ad %s' --name-status >"$sources/git-log.txt"
          "$GITHUB_WORKSPACE/bin/github" run list --limit 1000 --json databaseId,workflowName,displayTitle,event,headBranch,conclusion,createdAt,url | jq -c '.[]' >"$sources/runs.jsonl"
          head -n "$NEWEST_RUNS" "$sources/runs.jsonl" | jq -r .databaseId | while read -r run; do
            "$GITHUB_WORKSPACE/bin/github" api "repos/$GH_REPO/actions/runs/$run/jobs" --jq ".jobs[] | {run: $run, job: .name, conclusion, steps: [.steps[] | {name, conclusion}]}"
          done >"$sources/jobs.jsonl"
          "$GITHUB_WORKSPACE/bin/github" api "repos/$GH_REPO/actions/artifacts?per_page=$NEWEST_LOGS" --jq '.artifacts[] | select(.expired | not) | "\(.id) \(.workflow_run.id) \(.name)"' | while read -r id run kept; do
            "$GITHUB_WORKSPACE/bin/github" api "repos/$GH_REPO/actions/artifacts/$id/zip" >"$sources/machine-logs/$id.zip"
            python3 -m zipfile -e "$sources/machine-logs/$id.zip" "$sources/machine-logs/$run-$kept-$id"
            rm "$sources/machine-logs/$id.zip"
          done
          cp -r "$SESSION_CAPTURES/." "$sources/sessions"
          printf 'RESEARCH_SOURCES=%s\n' "$sources" >>"$GITHUB_ENV"

      - id: research
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 42
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 40
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/research-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/research" ${{ github.event.issue.number }}

      - if: ${{ steps.labelled.outputs.held != 'false' && (failure() || cancelled()) }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ github.event.issue.number }}
          run: the research run
          token: ${{ steps.app.outputs.token }}

      - if: always() && steps.labelled.outputs.held != 'false'
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  asked:
    if: ${{ github.event_name == 'push' || (github.event_name == 'issue_comment' && github.event.sender.login == github.repository_owner) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      asked: ${{ steps.asked.outputs.asked }}
      marked: ${{ steps.marked.outputs.marked }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          spec=$(bin/spelled SPEC)
          paused=$(bin/spelled PAUSED)
          stuck=$(bin/spelled STUCK)
          held=$(jq --arg SPEC "$spec" --arg PAUSED "$paused" --arg STUCK "$stuck" 'any(.issue.labels[]?.name; . == $SPEC) and (any(.issue.labels[]?.name; . == $PAUSED or . == $STUCK) | not)' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: asked
        if: steps.labelled.outputs.held == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          asked=$(bin/done-check ${{ github.event.issue.number }} --asked)
          printf 'asked=%s\n' "$asked" >>"$GITHUB_OUTPUT"

      - id: marked
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          marked=$(gh issue list --state open --label "$(bin/spelled SPEC)" --label "$(bin/spelled ASKED)" --limit 100 --json number --jq '[.[].number]')
          printf 'marked=%s\n' "$marked" >>"$GITHUB_OUTPUT"

  check:
    needs: asked
    if: ${{ needs.asked.outputs.asked == 'true' || (needs.asked.outputs.marked != '' && needs.asked.outputs.marked != '[]') }}
    strategy:
      matrix:
        spec: ${{ fromJSON(needs.asked.outputs.asked == 'true' && format('[{0}]', github.event.issue.number) || needs.asked.outputs.marked) }}
    concurrency:
      group: done-check-${{ matrix.spec }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pinned
        uses: ./.github/actions/pinned

      - id: npm-ci
        run: npm ci

      - id: logs
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: done-check
        timeout-minutes: 50
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/done-check-${{ matrix.spec }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/done-check" ${{ matrix.spec }}

      - if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ matrix.spec }}
          run: the done check run
          token: ${{ steps.app.outputs.token }}

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  dispatch-rerun:
    needs: [slice, ended, reslice, size-trial, resumed, resume, research, asked, check]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          CALLED_FROM: ${{ github.workflow_ref }}
          TICKET: ${{ github.event.issue.number || github.event.inputs.ticket }}
        run: bin/rerun --dispatch "$RUN" "$ATTEMPT"
