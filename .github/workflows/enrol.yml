name: Enrol

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/*-caller.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrol
  cancel-in-progress: false

jobs:
  enrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Write the stub set into every enrolled repository
        run: npx tsx .Workflow/agent-workflows/enrol/enrol.ts
        env:
          GH_TOKEN: ${{ secrets.ENROL_PAT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KNOWLEDGE_BASE_DEPLOY_KEY: ${{ secrets.KNOWLEDGE_BASE_DEPLOY_KEY }}
