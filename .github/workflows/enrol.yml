name: Enrol

"on":
  push:
    branches: [main]

permissions: {}

jobs:
  enrol:
    runs-on: ${{ vars.QUICK_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CORE_APP_PRIVATE_KEY: ${{ secrets.CORE_APP_PRIVATE_KEY }}
        run: |
          gh api installation/repositories --paginate --jq '.repositories[].full_name' | while read -r repo; do
            gh api "repos/$repo/contents/.github/workflows/machine.yml" --silent 2>/dev/null || continue
            printf '%s\n' "$repo"
          done | xargs -r -I {} bin/enrol {} --caller
