name: Review

"on":
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

jobs:
  review:
    permissions:
      contents: read
      issues: write
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'push'
    uses: collod873/claude-workflow/.github/workflows/review.yml@main
    with:
      head_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
