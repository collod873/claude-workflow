name: Review

"on":
  repository_dispatch:
    types: [review-wanted]

jobs:
  review:
    permissions:
      contents: read
      issues: write
    uses: collod873/claude-workflow/.github/workflows/review.yml@main
    with:
      head_sha: ${{ github.event.client_payload.head_sha }}
      base_sha: ${{ github.event.client_payload.base_sha }}
    secrets: inherit
