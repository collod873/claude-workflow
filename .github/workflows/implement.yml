name: Implement (reusable)

# PRD #145 move 6 (#167): the connector for one implementer per ready slice. Fires on the
# `repository_dispatch` `to-tickets.yml`'s publish step sends for every slice with zero unresolved
# blocked-by edges (`IMPLEMENT_DISPATCH_EVENT_TYPE` in
# `.Workflow/agent-workflows/implement/implement.ts`) — never on a label, never on who is logged in.
#
# `types:` names this lane's own action, for the reason `audit.yml` gives and ADR-0090 rules. This
# lane is one of the five an unfiltered trigger woke on every unrelated `session-captured`: four
# runs, four skips, and a history that read "lane 05 has never succeeded" identically to "lane 05
# has never been asked to do anything" (#183, #188). The job-level `if` below is still what scopes
# a run, checked against the same constant `implement.test.ts` imports rather than a copy-pasted
# string.
#
# **This job carries no sender-gate `if:` condition, on purpose** — contrast `spec.yml` and
# `shape.yml`, both triggered by a human-forgeable event (a label, a comment) and both gated on
# `github.event.sender.login` / `author_association` because of it. A `repository_dispatch` can
# only be sent by something already holding a repo-scoped token — this pipeline's own publish step
# — so the dispatch send is itself the gate; a second one here would be checking an identity that
# was never in question.
#
# **The sender side is not wired yet.** `to-tickets.ts`'s publish step does not send this dispatch
# in this checkout — that belongs to whichever ticket owns `to-tickets/slice-and-publish.ts`, not
# this one's claimed files (#167's "Files claimed" names only `.Workflow/agent-workflows/implement/`
# and this file). This file exists to get the receiving side right and provable, the same way
# `spec.yml` shipped its owner-gated trigger ahead of a runnable stage dispatch.
#
# ADR-0055 (amended by ADR-0132): this is a *reusable* workflow — `on: workflow_call` — so a caller
# repository carries only `implement-caller.yml`, a trigger and a `uses:`, never a copy of the
# machine. This repository is its own first caller: the caller stub lives next to this file, at the
# same commit, so the bytes shipped are the bytes that run. Two checkouts below —
# `collod873/claude-workflow` (the machine, for `implement.ts`, the implementer's own prompt, and
# the generators `regenerate-artifacts.ts` runs) and the calling repository's own tree (the target,
# where the ticket is actually built) — never one copy standing in for the other. Of every lane in
# this pipeline this is the one where that distinction bites hardest: the implementer holds Edit,
# Write and Bash and *builds with them*, so the model's own working directory has to be the target
# and not the machine, or a run would edit the pipeline instead of the repository it was dispatched
# for. `TARGET_WORKSPACE` on the `Implement the ticket` step below is what says which is which —
# `implement.ts`'s `main()` threads it through the model's cwd, every `git -C`, every file the
# answer is written to, the acceptance run that assembles the brief, and the generators — the same
# variable and the same reading `integrate.yml` and `shape.yml` already use. The machine checkout
# carries no credential input of its own: ADR-0132 made this repository public, so
# `actions/checkout` reads it anonymously and no PAT is added here that would have to be rotated in
# every enrolled repository.

"on":
  workflow_call:
    inputs:
      # Which runner this lane's jobs run on. The default is what every enrolled repository gets;
      # a canary target passes its own self-hosted label so a machine change is proven on real
      # GitHub at desk speed instead of landing on `main` to find out (amends ADR-0144).
      runner:
        type: string
        required: false
        default: ubuntu-latest
      # The ref of this machine to check out — the same ref the caller's `uses:` pins. GitHub
      # gives a called workflow no way to learn its own ref: inside it, `github.workflow_ref` and
      # `github.workflow_sha` name the *caller's* stub, and `job_workflow_sha` exists only as an
      # OIDC claim (canary run 33706922620 printed the whole context to prove it). Without this,
      # a stub pinned to any ref but `main` runs that ref's YAML around `main`'s TypeScript.
      machine_ref:
        type: string
        required: false
        default: main

# `issues: write`, not `read`: `implement.ts` reaches `implement/out-of-brief.ts`, which files and
# comments on the out-of-brief tracker with `gh issue create` / `gh issue comment`. Under `read`
# that is a `Resource not accessible by integration (createIssue)` at the *end* of the run — lane 05
# run 33230260687 hit it after 19 turns and $0.44, and left the claim branch `implement/issue-212`
# behind for a human to delete (#181, #196). `workflow-permissions.test.ts` now derives this
# requirement from the entrypoint rather than trusting the block, so narrowing it back fails locally.
permissions:
  contents: write
  pull-requests: write
  issues: write

# **Keyed on the ticket, so a wave runs as wide as lane 03 cut it** — ADR-0039's ruling, and the
# chain-shape ladder is the guarantee behind it.
#
# A single fixed group across every ticket — what `integrate.yml` correctly uses, because there is
# one trunk to merge onto — was wrong here and lost work. GitHub holds **at most one pending run per
# group**, and a newly queued run cancels whatever was pending: `cancel-in-progress: false` protects
# the run that is *executing* and nothing else. A wave of three therefore ran one, queued one, and
# silently cancelled the third (#241, runs 33284271370/33284271425/33284271618) — the exact
# silently-unbuilt slice the fixed group was introduced to prevent.
#
# `cancel-in-progress: false` still, and now it means what it says: keyed per ticket, the only run
# that can contend for this group is a re-dispatch of the same ticket, and the one already building
# is the one to keep.
concurrency:
  group: implement-${{ github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.action == 'ticket-ready'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      TICKET_NUMBER: ${{ github.event.client_payload.issue }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      # Same shape as `to-tickets.yml`'s own preflight: fail closed on an empty secret before Node
      # is even set up, rather than let a stage spawn `claude` with nothing to authenticate it.
      - name: Preflight — CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before the implementer can run." >&2
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      # The target's own `node_modules`, separate from the machine's install above: the brief this
      # lane assembles is built from the target's *failing* acceptance tests, which means running
      # the target's vitest against the target's tree, and the implementer then runs the target's
      # own checks with Bash while it builds. The machine's install is what puts `tsx` itself on
      # PATH, resolved from the nearest ancestor `node_modules` since `target/` sits directly under
      # the machine checkout that already has one — the same arrangement `integrate.yml` uses.
      - name: Install target dependencies
        working-directory: target
        run: npm ci

      # Same pin as `to-tickets.yml`/`audit.yml` (ADR-0002): a run comes from the checkout alone, so
      # a floating install would let a release published next month change what a rerun does.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      # A runner has no git identity, and the branch this pushes is committed here, not by a human
      # workstation that already has one configured — same fix `audit.yml` needed for its own note.
      # Scoped to the target checkout: it is the only one this job ever commits into.
      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Mark the ticket running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "on"

      # The whole flow: read the ticket, assemble its brief from exactly the four ingredients #167
      # names, run the implementer stage, write what it returns, commit and push a branch, open
      # exactly one PR, and send exactly one verification dispatch naming it.
      - name: Implement the ticket
        # Set here rather than in the job's `env:`, where the `runner` context does not exist —
        # actionlint refuses that, and the invalid file stops the whole workflow being schedulable,
        # so a `ticket-ready` dispatch lands on nothing at all. `runner.temp` puts the receipt
        # outside the checkout, where it can never be staged into the branch it describes.
        env:
          IMPLEMENT_ANSWER_PATH: ${{ runner.temp }}/implementer-answer.json
          # Which checkout is the repository being built (ADR-0055) — see this file's header for
          # why this lane cares more than any other. Absolute, so `implement.ts` can resolve every
          # repo-relative path in the ticket against it while the answer receipt above, already an
          # absolute path of its own, is left alone.
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: |
          # The one place this run's own ticket number is written down for a reader with only the
          # run log — the same shape verify.yml's `judging $PR on $BRANCH` line and ADR-0104 use.
          # `recover.yml` reads this back when a run died before the `implementer-answer-<n>`
          # artifact ever uploaded, which is the only other place the number is recorded.
          echo "implementing #$TICKET_NUMBER"
          npx tsx .Workflow/agent-workflows/implement/implement.ts "$TICKET_NUMBER"

      # `always()`, because the runs worth recovering are the ones that did not end in a pull
      # request. The implementer's answer lives in the model's reply and nowhere else: the runner
      # log renders the call as a bare `StructuredOutput()` with the payload elided, so a run that
      # builds a ticket and then discards it leaves nothing on GitHub to rebuild it from. Run
      # 33275876786 lost 23 minutes and $6.36 of correct work that way (ADR-0103).
      - name: Keep the implementer's answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementer-answer-${{ github.event.client_payload.issue }}
          path: ${{ runner.temp }}/implementer-answer.json
          if-no-files-found: ignore
          retention-days: 30

      # `always()` for the same reason the upload above carries it, and more so: the run this most
      # needs to clean up after is the one that died. A `running` label left behind by a timeout is
      # a lie the tracker keeps telling, which is worse than never having written it.
      # Rings lane Recover directly. `recover.yml` also listens on `workflow_run`, the documented
      # door, and on 2026-08-30 that event arrived five to fourteen minutes late for two Verify runs
      # and never at all for Implement run 33326295612. A `repository_dispatch` sent with
      # `GITHUB_TOKEN` is the wire every lane in this pipeline already chains on, and it did not
      # miss once that day. Both doors stay: Recover's marker comment makes the second arrival a
      # no-op, so the cost of two is nothing and the cost of one was a run nobody recovered.
      # `cancelled()` alongside `failure()`, because a `timeout-minutes` kill reports **cancelled**
      # and a timeout is exactly the death this step exists for. #342's run 33687023105 was killed
      # at 45 minutes to the second: the upload above ran (`always()`) and found nothing, the
      # unmark below ran and cleared `running`, and this step — the only one that tells Recover
      # anything — skipped. Recover's no-artifact path re-dispatches the ticket, so the whole
      # stranding (an orphaned `implement/issue-342` claim that made the ticket unbuildable,
      # because `reconcile.ts` reads a claim ref as started and the stale-claim takeover only runs
      # inside a dispatch that would never come) was this one condition. A human-cancelled run
      # reaches Recover too now, which is right: it holds the same claim and wants the same
      # cleanup.
      - name: Tell Recover this run failed
        if: failure() || cancelled()
        run: |
          gh api "repos/{owner}/{repo}/dispatches" \
            -f event_type=implement-failed \
            -f "client_payload[run_id]=$GITHUB_RUN_ID" \
            -f "client_payload[issue]=$TICKET_NUMBER"

      - name: Unmark the ticket
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "off"
