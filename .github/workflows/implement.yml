name: Implement (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: implement-${{ github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.action == 'ticket-ready'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      TICKET_NUMBER: ${{ github.event.client_payload.issue }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Preflight — CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before the implementer can run." >&2
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        working-directory: target
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Mark the ticket running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "on"

      - name: Implement the ticket
        env:
          IMPLEMENT_ANSWER_PATH: ${{ runner.temp }}/implementer-answer.json
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: |
          # The one place this run's own ticket number is written down for a reader with only the
          # run log — the same shape verify.yml's `judging $PR on $BRANCH` line and ADR-0104 use.
          # `recover.yml` reads this back when a run died before the `implementer-answer-<n>`
          # artifact ever uploaded, which is the only other place the number is recorded.
          echo "implementing #$TICKET_NUMBER"
          npx tsx .Workflow/agent-workflows/implement/implement.ts "$TICKET_NUMBER"

      - name: Keep the implementer's answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementer-answer-${{ github.event.client_payload.issue }}
          path: ${{ runner.temp }}/implementer-answer.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Tell Recover this run failed
        if: failure() || cancelled()
        run: |
          gh api "repos/{owner}/{repo}/dispatches" \
            -f event_type=implement-failed \
            -f "client_payload[run_id]=$GITHUB_RUN_ID" \
            -f "client_payload[issue]=$TICKET_NUMBER"

      - name: Unmark the ticket
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "off"
