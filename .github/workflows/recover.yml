name: Recover (reusable)

"on":
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ""
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: recover-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        working-directory: target
        run: npm ci

      - name: Recover or re-dispatch
        env:
          HUSKY: "0"
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/recover/recover.ts
