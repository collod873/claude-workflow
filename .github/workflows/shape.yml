name: Shape (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: shape-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  shape:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      IDEA_NUMBER: ${{ github.event.issue.number }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_LABEL: ${{ github.event.label.name }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      EVENT_ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
      EVENT_ISSUE_PULL_REQUEST: ${{ github.event.issue.pull_request.url }}
      EVENT_COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
      EVENT_COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CHANGE_REQUEST: ${{ github.event.comment.body }}
    steps:
      - name: Export the handoff path
        run: echo "FAILURE_REASON_PATH=$RUNNER_TEMP/failure_reason.txt" >> "$GITHUB_ENV"

      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Restore checkpoints
        uses: ./.github/actions/checkpoints
        with:
          phase: restore
          lane: shape
          issue: ${{ env.IDEA_NUMBER }}

      - name: Preflight, CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before a stage can run." > "$FAILURE_REASON_PATH"
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Shape
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/shape/shape.ts --issue "$IDEA_NUMBER"

      - name: Upload checkpoints
        if: always()
        uses: ./.github/actions/checkpoints
        with:
          phase: upload
          lane: shape
          issue: ${{ env.IDEA_NUMBER }}

      - name: Report failure
        if: always()
        env:
          REPORT_LANE: shape
          REPORT_ISSUE: ${{ env.IDEA_NUMBER }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERB: ""
          REPORT_REFUSED: "false"
        run: npx tsx .Workflow/agent-workflows/shared/report-lane-failure.ts

      - name: Hand the idea to the owner if this run died
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: npx tsx .Workflow/agent-workflows/shared/labels.cli.ts fail "$IDEA_NUMBER" --status "$JOB_STATUS"
