name: Shape (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: shape-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  shape:
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'idea' &&
       github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'idea') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      IDEA_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CHANGE_REQUEST: ${{ github.event.comment.body }}
    steps:
      - name: Export the handoff path
        run: echo "FAILURE_REASON_PATH=$RUNNER_TEMP/failure_reason.txt" >> "$GITHUB_ENV"

      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Restore checkpoints
        uses: ./.github/actions/checkpoints
        with:
          phase: restore
          lane: shape
          issue: ${{ env.IDEA_NUMBER }}

      - name: Ensure the lane's labels exist
        run: |
          set -euo pipefail
          gh label create shape-refused --color b60205 \
            --description "Refused at lane 01 stage 1: the idea already exists, or an ADR ruled it" --force
          gh label create needs-human --color d93f0b \
            --description "Ticket stalled; a human decision or action is required" --force
          gh label create approved --color 0e8a16 \
            --description "The owner accepted a decision sheet; files its ADRs and dispatches" --force
          gh label create parked --color fbca04 \
            --description "Shaped and set down. No dispatch, and nothing ever re-raises it" --force
          gh label create killed --color 6a737d \
            --description "Shaped and rejected. Becomes prior art the sweep refuses against" --force
          gh label create go-long --color 1d76db \
            --description "ADR-0007's route override, applied alongside approved" --force
          gh label create go-short --color 1d76db \
            --description "ADR-0007's route override, applied alongside approved" --force

      - name: Preflight, CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before a stage can run." > "$FAILURE_REASON_PATH"
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Mark the idea running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.IDEA_NUMBER }}
          mode: "on"

      - name: Shape
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/shape/shape.ts --issue "$IDEA_NUMBER"

      - name: Upload checkpoints
        if: always()
        uses: ./.github/actions/checkpoints
        with:
          phase: upload
          lane: shape
          issue: ${{ env.IDEA_NUMBER }}

      - name: Report failure
        if: failure()
        run: |
          reason="unknown stage"
          if [ -f "$FAILURE_REASON_PATH" ]; then
            reason=$(cat "$FAILURE_REASON_PATH")
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          evidence="\n**Checkpoints:** the \`checkpoints-shape-${IDEA_NUMBER}\` artifact on that run.\n"
          body=$(printf 'Shape run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n%b' "$reason" "$run_url" "$evidence")
          gh issue comment "$IDEA_NUMBER" --body "$body"

      - name: Unmark the idea
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.IDEA_NUMBER }}
          mode: "off"
