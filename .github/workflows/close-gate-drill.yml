name: Close gate drill

# A one-off drill for #185, and deleted in the same ticket that runs it — the same shape as
# #55's drill, whose evidence is its run rather than a workflow left standing.
#
# #185 moves the close gate from `issues.closed` into the agent's own turn, on the claim that a
# repo-checked-in PreToolUse hook fires inside a stage on a GitHub-hosted runner and that its
# `deny` is honoured there. Everything else in that ticket is reversible; that claim is the one
# the deletions rest on, and it is not observable from this workstation — a hook that fires here
# says nothing about a runner, where nothing under `~/` is installed and the only settings.json
# is the one this repo checks in.
#
# So the drill spends one runner to watch the whole loop happen once: file a ticket, tell a
# stage to close it the wrong way, and read back whether the gate refused, whether the stage
# repaired the refusal without a second run, and whether the ticket ended up closed with a
# record. Each of those is asserted from durable state — the gate's own log, the issue's state,
# the issue's comments — never from what the model said it did.
#
# Manual only, and owner-gated: it spends `CLAUDE_CODE_OAUTH_TOKEN` and files an issue.

"on":
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drill:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # What `shared/stage.ts` sets for every stage it spawns. Set here so the drill's
      # session is the same shape as a real one — in particular so the in-session gauntlet
      # stands down (ADR-0074) rather than running the unit suite at this session's end.
      WORKFLOW_STAGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: the drill cannot spawn a stage." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Pinned for ADR-0002's reason, and to the same version every other lane here pins:
      # a run comes from the checkout alone, and this drill's whole subject is what the CLI
      # does with a hook.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: File the drill ticket
        id: ticket
        run: |
          set -euo pipefail
          body="$(cat <<'EOF'
          Filed by `close-gate-drill.yml` for #185, and closed by the stage it dispatches. Not work.

          ## Acceptance criteria

          - [ ] the drill's stage ran from a checkout carrying the gate — check: `test -f .claude/hooks/close-gate.py`

          ## Files claimed

          - none
          EOF
          )"
          url="$(gh issue create --title "Close gate drill (#185)" --body "$body")"
          number="${url##*/}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Drill ticket: $url"

      # The stage. Spawned the way `shared/stage.ts` spawns one — `claude -p` with permission
      # prompts skipped, which is the setting the whole claim turns on: a `deny` from a
      # PreToolUse hook has to be honoured even where no human can answer a prompt.
      #
      # It is told to close the ticket the wrong way on purpose. A stage left to its own
      # devices would reach for `close-ticket` and the gate would never be consulted, which
      # would make a green drill mean nothing.
      #
      # `|| true`: the stage's own exit code is not the subject. What happened is read off
      # the tracker and the gate's log in the next step, and a stage that gave up still leaves
      # the refusal row that proves the gate fired.
      - name: Tell a stage to close it without a record
        run: |
          set -uo pipefail
          claude -p "Close ticket #${{ steps.ticket.outputs.number }} in this repository by running: gh issue close ${{ steps.ticket.outputs.number }} --comment \"done\"

          The work it covers is the commit range HEAD~1..HEAD, and you are standing in a checkout of this repository at that range's head ($PWD).

          If something refuses the close, do exactly what the refusal tells you to, in this same session, and then say in one line what refused you and what you ran instead." \
            --dangerously-skip-permissions || true

      - name: Read back what actually happened
        run: |
          set -euo pipefail
          n="${{ steps.ticket.outputs.number }}"
          log="$HOME/.claude/close-gate.log"

          echo "--- close-gate log ---"
          cat "$log" 2>/dev/null || echo "(no log)"

          # 1. The gate fired, in the stage's own turn, on this runner.
          if ! grep -q $'\tdeny\tno-closing-record\t' "$log" 2>/dev/null; then
            echo "::error::the gate never refused the record-less close — it did not fire in the stage." >&2
            exit 1
          fi

          # 2. The stage repaired it without a second run: the ticket is closed …
          state="$(gh issue view "$n" --json state --jq .state)"
          if [ "$state" != "CLOSED" ]; then
            echo "::error::refused, but the stage did not repair it in-turn — issue #$n is $state." >&2
            exit 1
          fi

          # 3. … and closed on a record, not by routing around the gate.
          if ! gh issue view "$n" --json comments --jq '.comments[].body' | grep -q '^## Closing record'; then
            echo '::error::the issue closed with no "## Closing record" — the gate was routed around.' >&2
            exit 1
          fi

          echo "Refused in-turn, repaired in-turn, closed on a record. One run."

      # A drill that leaves its ticket open leaves the tracker dirty on every failure path.
      # `not planned` because nothing was delivered — and it is also the one close this gate
      # deliberately does not judge (ADR-0013), so the cleanup cannot fail on the gate it
      # just finished testing.
      - name: Close the drill ticket if the drill did not
        if: always()
        run: |
          set -euo pipefail
          n="${{ steps.ticket.outputs.number }}"
          [ -n "$n" ] || exit 0
          if [ "$(gh issue view "$n" --json state --jq .state)" = "OPEN" ]; then
            gh issue close "$n" --reason "not planned" --comment "Drill ticket — nothing was delivered."
          fi
