name: Lost-dispatch counter (reusable)

"on":
  workflow_call:
    inputs:
      slicing_workflow:
        type: string
        required: true
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: lost-dispatch-counter
  cancel-in-progress: false

jobs:
  count:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      LABEL_NAME: ${{ github.event.label.name }}
      PRD_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SLICING_WORKFLOW: ${{ inputs.slicing_workflow }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Count a lost dispatch
        run: npx tsx .Workflow/agent-workflows/watchdog/lost-dispatch-counter.ts
