name: Spec (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: spec-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  spec:
    if: >-
      (github.event_name == 'repository_dispatch') ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'to-spec' &&
       github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'prd' &&
       !contains(github.event.issue.labels.*.name, 'sliceable') &&
       github.event.sender.login == github.repository_owner)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      dispatch-requests: ${{ steps.collect-dispatch.outputs.requests }}
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue }}
      SPEC_TRIGGER: >-
        ${{ (github.event.label.name == 'prd' && 'critique') || 'to-spec' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Export the dispatch handoff path
        run: echo "DISPATCH_REQUESTS_PATH=$RUNNER_TEMP/dispatch-requests.jsonl" >> "$GITHUB_ENV"

      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Preflight, CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty; refusing to start the spec author"
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Mark the source running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.ISSUE_NUMBER }}
          mode: "on"

      - name: Spec author
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/spec/spec.ts

      - name: Collect the dispatches this run asked for
        id: collect-dispatch
        run: |
          set -euo pipefail
          [ -s "$DISPATCH_REQUESTS_PATH" ] || exit 0
          {
            echo "requests<<DISPATCH_REQUESTS_EOF"
            cat "$DISPATCH_REQUESTS_PATH"
            echo "DISPATCH_REQUESTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report failure
        if: ${{ !success() }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # shellcheck disable=SC2016  # the backticks are Markdown for the issue comment, not command substitution
          body=$(printf 'The spec lane did not finish.\n\nNothing here is automatic to recover: the run below says where it stopped, and re-applying `to-spec` starts it again.\n\n**Workflow run:** %s\n' "$run_url")
          gh issue comment "$ISSUE_NUMBER" --body "$body"

      - name: Unmark the source
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.ISSUE_NUMBER }}
          mode: "off"

  dispatch:
    name: Start lane 03
    needs: [spec]
    if: needs.spec.outputs.dispatch-requests != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DISPATCH_REQUESTS: ${{ needs.spec.outputs.dispatch-requests }}
    steps:
      - name: Send the dispatch
        run: |
          set -euo pipefail
          printf '%s\n' "$DISPATCH_REQUESTS" | while IFS= read -r request; do
            [ -n "$request" ] || continue
            printf '%s' "$request" | gh api --method POST 'repos/{owner}/{repo}/dispatches' --input -
          done
