name: Spec

# Lane 02 (PRD #145, move 6). Two triggers feed the spec **author** (ADR-0058) — an accepted
# decision sheet, and a closed Wayfinder Map carrying `to-spec`. A third door feeds the **critic**
# alone: the owner's own hand putting `prd` on a spec he already wrote in a live session
# (ADR-0085). That door arrives with the spec already drafted, so it runs one Opus stage where the
# cold doors run two, and it publishes nothing — the issue it fires on *is* the draft.
#
# ADR-0058's "a live session never fires a runner" was the reason this file used to gate only two
# triggers. It was wrong about the mechanism: ADR-0062's "an event caused by the built-in
# `GITHUB_TOKEN` starts no workflow run" does not bind here, because `bin/file-issue spec` runs
# under the owner's own credentials. His issue creation is a real event; nothing was listening at
# it, and a session-written spec sat on the tracker forever (#180, #145).
#
# **Both triggers are gated on who caused them, because both spend model (ADR-0073).** The
# repository is public, so a label or a comment can arrive from anyone, not only the owner — the
# same fact `shape.yml` was rewritten against, and this is that file's exact two-sided shape,
# reused rather than re-derived (`shared/read-workflow.ts` is what lets both workflows' tests read
# their own `if:` back out of the YAML instead of trusting a copy-paste by eye).
#
# `github.event.sender` is who performed the act, not who owns the thing acted on: applying
# `to-spec` to a closed map is a hand-applied label exactly like `idea` in `shape.yml`, so the
# sender gate covers it the same way — a stranger's map is refused, the owner's own hand on the
# label is not. The `prd` clause carries the identical gate for the identical reason: `prd` can be
# applied by anyone with write access and `file-issue spec` is not the only way it lands.
# Remove-and-re-add of the label is the re-run gesture, as it is in lane 01.
#
# That clause is narrowed to a spec without `sliceable`. A spec that has already passed the gate
# has nothing left for the critic to decide, and re-labelling one would spend an Opus stage to
# re-derive a count that already dispatched.
#
# A comment is gated on `author_association` instead, `MEMBER` and `COLLABORATOR` riding along
# with `OWNER` so the rule need not be reopened the day a second person is added. This is
# `rounds.ts`'s re-run door (ADR-0062): the owner's answer to a posted round of open questions is a
# comment on the spec issue, and that comment is what re-runs the chain and recounts.
#
# That door is narrowed to a spec **still holding questions** — open, and without `sliceable`.
# ADR-0062 scopes the re-run to "his answer" to a posted round, and a spec that has already
# dispatched has no round outstanding to answer. Without the narrowing, every comment on any `prd`
# issue re-ran the whole lane: closing #145 fired two runs off its own closing record. They failed
# safe on the missing source marker and spent no model, but a spec that *had* one would have paid
# two Opus stages to redraft a finished spec from a comment that answered nothing.
#
# The accepted sheet arrives as a `repository_dispatch` and **not** as the `approved` label
# (ADR-0083). The sheet collector reads the accept's payload marker out of the accept comment and
# throws without it, so a job firing on the same label would race the write it depends on — and
# lose, because lane 01 files ADRs, commits and pushes before it ever comments. `shape/accept.ts`
# sends the dispatch as its last act instead. It carries no sender gate: `POST /dispatches` needs
# write access, so the send is itself the gate (ADR-0073).
#
# `types:` names that one action, for the reason `audit.yml` gives and ADR-0090 rules: unfiltered,
# this lane woke on every `session-captured` the capture hook sent and skipped, so its eight runs
# read as a lane that has never worked rather than a lane that has rarely been asked. The
# job-level `if:` is still the scope rule, and it names the one constant the sender reads
# (`SPEC_AUTHOR_DISPATCH_EVENT_TYPE`, `.Workflow/agent-workflows/spec/publish.ts`).
#
# `SPEC_TRIGGER` is decided here and read by `invocationFromEnv` rather than re-derived in
# TypeScript from the raw event: the `if:` below has already decided which of the four fired, and a
# second copy of that condition is a second thing that can disagree with it. Two of the four are
# now the same `issues: labeled` event, so the expression tests the *label* rather than the event
# name — an `event_name == 'issues'` arm would send both doors to whichever one it named.

"on":
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [sheet-accepted]

# `contents: read` is the model job's, and it is deliberate: ADR-0053 is careful about what a job
# that runs a model may write, and this one runs two Opus stages. `POST /dispatches` needs
# `contents: write`, so the dispatch this lane owes lane 03 is sent by the second job below —
# `permissions:` is per-job, which is the whole reason the split works
# ([ADR-0091](../../docs/adr/0091-the-token-that-spends-a-model-and-the-token-that-starts-the.md), #181).
permissions:
  contents: read
  issues: write

# One spec run per issue at a time — the same reasoning as `shape.yml`'s group: a label and a
# fast-follow comment can both arrive within seconds, and two concurrent chains would each read a
# round count that did not include the other.
#
# Queued, never cancelled (ADR-0111). A critic comment is the ordinary rhythm of this lane, so
# `cancel-in-progress: true` here meant the busier the critique, the less of it ever got answered.
concurrency:
  group: spec-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  spec:
    if: >-
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'sheet-accepted') ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'to-spec' &&
       github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'prd' &&
       !contains(github.event.issue.labels.*.name, 'sliceable') &&
       github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       contains(github.event.issue.labels.*.name, 'prd') &&
       !contains(github.event.issue.labels.*.name, 'sliceable') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # What `applyGate` asked to be dispatched, as one JSON body per line. Empty on every run that
      # held — the `dispatch` job below is skipped on empty rather than sending nothing.
      dispatch-requests: ${{ steps.collect-dispatch.outputs.requests }}
    env:
      # The dispatch names its subject in `client_payload.issue` (`dispatchSpecAuthor`); the two
      # tracker events carry it as the issue they happened on. One of the two is always empty.
      ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue }}
      SPEC_TRIGGER: >-
        ${{ (github.event_name == 'repository_dispatch' && 'sheet') ||
            (github.event.label.name == 'to-spec' && 'map') ||
            (github.event.label.name == 'prd' && 'critique') ||
            'answer' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      # Exported here rather than in the job `env` above for the reason `to-tickets.yml` records at
      # length: the `runner` context does not exist when job-level `env` is evaluated, and naming it
      # there is what made that file unparseable for two days (#40). `RUNNER_TEMP` is the same value
      # read where it exists.
      - name: Export the dispatch handoff path
        run: echo "DISPATCH_REQUESTS_PATH=$RUNNER_TEMP/dispatch-requests.jsonl" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      # Same shape as every other model-spending lane's preflight: fail closed on an empty secret
      # before Node is set up, rather than let the stage spawn `claude` with nothing to
      # authenticate it.
      - name: Preflight — CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty; refusing to start the spec author"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      # The whole lane: on a cold door, collect the decided context this trigger names, run the
      # author and the critic, publish (or rewrite) the `PRD:` issue; on the critic-only door, read
      # the spec that is already there. Both then gate on the open-question count — `sliceable`
      # plus a dispatch at zero, the numbered questions as a comment otherwise.
      - name: Spec author
        run: npx tsx .Workflow/agent-workflows/spec/spec.ts

      # Carries what the gate asked for across the job boundary. A file in `runner.temp` dies with
      # the runner, so the request has to become a job output for a second machine to read it.
      - name: Collect the dispatches this run asked for
        id: collect-dispatch
        run: |
          set -euo pipefail
          [ -s "$DISPATCH_REQUESTS_PATH" ] || exit 0
          {
            echo "requests<<DISPATCH_REQUESTS_EOF"
            cat "$DISPATCH_REQUESTS_PATH"
            echo "DISPATCH_REQUESTS_EOF"
          } >> "$GITHUB_OUTPUT"

  # The other half of ADR-0091's split: `contents: write`, no model, no checkout, and nothing to do
  # but post what the job above decided. It runs only when there is something to send, so a spec
  # that held its questions produces no job here at all rather than a green one that sent nothing.
  #
  # `sliceable` was written by the job above *before* this one runs, which is ADR-0062's ordering
  # kept: if this job fails, the spec still carries the label with no slicing run behind it, and
  # `lost-dispatch-counter.yml` finds it. The split moves where the send happens, not what a lost
  # send leaves behind.
  dispatch:
    name: Start lane 03
    needs: [spec]
    if: needs.spec.outputs.dispatch-requests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DISPATCH_REQUESTS: ${{ needs.spec.outputs.dispatch-requests }}
    steps:
      - name: Send the dispatch
        run: |
          set -euo pipefail
          printf '%s\n' "$DISPATCH_REQUESTS" | while IFS= read -r request; do
            [ -n "$request" ] || continue
            printf '%s' "$request" | gh api --method POST 'repos/{owner}/{repo}/dispatches' --input -
          done
