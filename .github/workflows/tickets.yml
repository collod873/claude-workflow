name: Tickets

"on":
  workflow_call:

permissions: {}

jobs:
  build:
    if: "${{ github.event_name == 'issues' && github.event.action != 'closed' && (github.event.sender.login == github.repository_owner || (github.event.sender.login == 'collod873-machine[bot]' && (github.event.action == 'unlabeled' || github.event.action == 'opened'))) }}"
    concurrency:
      group: build-${{ github.event.issue.number }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 190
    cache-mode: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          waiting=$(bin/spelled WAITING)
          ticket=$(bin/spelled TICKET)
          note=$(bin/spelled NOTE)
          spec=$(bin/spelled SPEC)
          paused=$(bin/spelled PAUSED)
          stuck=$(bin/spelled STUCK)
          jq -r --arg WAITING "$waiting" --arg TICKET "$ticket" --arg NOTE "$note" --arg SPEC "$spec" --arg PAUSED "$paused" --arg STUCK "$stuck" '
            (any(.issue.labels[]?.name; . == $TICKET) and (any(.issue.labels[]?.name; IN($NOTE, $SPEC)) | not)) as $ticket
            | (any(.issue.labels[]?.name; IN($WAITING, $PAUSED, $STUCK)) | not) as $free
            | "held=\((.action == "opened" or .action == "reopened" or (.action == "unlabeled" and (IN(.label.name; $WAITING, $PAUSED, $STUCK)) and .issue.state != "closed")) and $ticket and $free)"
          ' "$GITHUB_EVENT_PATH" | tee -a "$GITHUB_OUTPUT"

      - id: pinned
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/pinned

      - id: npm-ci
        if: steps.labelled.outputs.held == 'true'
        run: npm ci

      - id: database
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/database

      - id: logs
        if: steps.labelled.outputs.held == 'true'
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: admit
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 2
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: '"$GITHUB_WORKSPACE/bin/admit" ${{ github.event.issue.number }} >>"$GITHUB_OUTPUT"'

      - id: git-config
        if: steps.labelled.outputs.held == 'true'
        working-directory: tree
        run: |
          git config user.name "core-app[bot]"
          git config user.email "core-app[bot]@users.noreply.github.com"

      - id: start
        if: steps.labelled.outputs.held == 'true' && steps.admit.outputs.admitted == 'true'
        timeout-minutes: 10
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          machine="$GITHUB_WORKSPACE/bin"
          branch="$("$machine/spelled" TICKET_PREFIX)${{ github.event.issue.number }}"
          printf 'branch=%s\n' "$branch" >>"$GITHUB_OUTPUT"
          building=$("$machine/spelled" BUILDING)
          if git fetch --quiet origin "$branch" 2>/dev/null && ! git merge-base --is-ancestor FETCH_HEAD origin/main; then # quiet: a ticket with no branch yet builds from main
            git checkout --quiet -b "$branch" FETCH_HEAD
          else
            git checkout --quiet -b "$branch"
          fi
          if [[ '${{ github.event.action }}' == reopened ]]; then
            "$machine/mark" ${{ github.event.issue.number }} "$building" --try
          else
            "$machine/mark" ${{ github.event.issue.number }} "$building"
          fi

      - id: restore
        if: steps.start.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/builder
          key: builder-${{ steps.start.outputs.branch }}-${{ github.run_id }}
          restore-keys: builder-${{ steps.start.outputs.branch }}-

      - id: fix
        if: steps.start.outcome == 'success'
        timeout-minutes: 170
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          QUIET_GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          CALLED_FROM: ${{ github.workflow_ref }}
        run: |
          tail --pid=$$ -q -n +1 -F .git/machine-logs/fix-${{ github.event.issue.number }}.jsonl .git/machine-logs/review-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          "$GITHUB_WORKSPACE/bin/fix" ${{ github.event.issue.number }}

      - if: always() && steps.fix.outcome != 'skipped'
        timeout-minutes: 2
        working-directory: tree
        env:
          BRANCH: ${{ steps.start.outputs.branch }}
        run: |
          if [[ -n $(git rev-list origin/main..HEAD) ]]; then
            git push --quiet --force origin "HEAD:refs/heads/$BRANCH"
          fi

      - if: always() && steps.fix.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/builder
          key: builder-${{ steps.start.outputs.branch }}-${{ github.run_id }}

      - if: (failure() || cancelled()) && steps.start.outcome == 'success'
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ github.event.issue.number }}
          run: "the builder's job"
          token: ${{ steps.app.outputs.token }}

      - if: always() && steps.labelled.outputs.held != 'false'
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  rerun:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rerun }}
    concurrency:
      group: rerun-${{ github.event.inputs.rerun }}
    runs-on: ${{ vars.QUICK_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RERUN: ${{ github.event.inputs.rerun }}
        run: |
          IFS=/ read -r run attempt <<<"$RERUN"
          bin/rerun "$run" "$attempt"

  probe:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.probe }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 70
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pinned
        uses: ./.github/actions/pinned

      - id: npm-ci
        run: npm ci

      - id: database
        uses: ./.github/actions/database

      - id: logs
        run: |
          mkdir -p tree/.git/machine-logs
          ln -s "$PWD/tree/.git/machine-logs" .git/machine-logs

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: probe-script
        if: github.event.inputs.probe_with != 'claude'
        timeout-minutes: 30
        working-directory: tree
        env:
          PROBE: ${{ github.event.inputs.probe }}
        run: |
          ended=0
          "$GITHUB_WORKSPACE/bin/probe" script "$PROBE" || ended=$?
          cat ".git/machine-logs/probe-$GITHUB_RUN_ID.out"
          exit "$ended"

      - id: probe-claude
        if: github.event.inputs.probe_with == 'claude'
        timeout-minutes: 50
        working-directory: tree
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          PROBE: ${{ github.event.inputs.probe }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/probe-${{ github.run_id }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          ended=0
          "$GITHUB_WORKSPACE/bin/probe" claude "$PROBE" || ended=$?
          cat ".git/machine-logs/probe-$GITHUB_RUN_ID.out"
          exit "$ended"

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

  close:
    if: ${{ github.event_name == 'issues' && github.event.action == 'closed' }}
    runs-on: ${{ vars.QUICK_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - id: checkout
        uses: actions/checkout@v4
        with:
          path: tree
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: close
        working-directory: tree
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          QUIET_GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOSED_ISSUE: ${{ github.event.issue.number }}
          CALLED_FROM: ${{ github.workflow_ref }}
        run: '"$GITHUB_WORKSPACE/bin/close" "$CLOSED_ISSUE"'

  strip:
    if: ${{ github.event.action == 'closed' }}
    runs-on: ${{ vars.QUICK_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: bin/mark "$NUMBER" --closed

      - if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ github.event.issue.number }}
          run: the strip run
          token: ${{ steps.app.outputs.token }}

  dispatch-rerun:
    needs: [build, close, strip]
    if: ${{ always() && (needs.build.result == 'failure' || needs.close.result == 'failure' || needs.strip.result == 'failure' || contains(needs.*.result, 'cancelled')) }}
    runs-on: ${{ vars.QUICK_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: machine
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          ref: main
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          CALLED_FROM: ${{ github.workflow_ref }}
          TICKET: ${{ github.event.issue.number || github.event.inputs.ticket }}
        run: bin/rerun --dispatch "$RUN" "$ATTEMPT"
