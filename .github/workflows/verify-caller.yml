name: Verify

"on":
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  repository_dispatch:
    types: [implementation-opened]

jobs:
  verify:
    permissions:
      contents: write
      pull-requests: read
    uses: collod873/claude-workflow/.github/workflows/verify.yml@main
