name: Machine
run-name: "${{ github.event_name == 'workflow_dispatch' && (inputs.rerun && format('Rerun of run {0}', inputs.rerun) || inputs.trial_cap && format('Size trial of #{0} under {1}', inputs.ticket, inputs.trial_cap) || format('Fix #{0}', inputs.ticket)) || github.event_name == 'workflow_run' && format('After {0} on {1}', github.event.workflow_run.name, github.event.workflow_run.head_branch) || github.event_name == 'push' && 'Push to main' || github.event_name == 'pull_request_target' && format('closed PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('{0} #{1}: {2}', github.event.action, github.event.issue.number, github.event.issue.title) }}"

"on":
  issue_comment:
    types: [created]
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:
    inputs:
      ticket:
        required: true
        type: string
      reason:
        required: true
        type: string
      trial_cap:
        required: false
        type: number
      rerun:
        required: false
        type: string

jobs:
  tickets:
    uses: collod873/claude-workflow/.github/workflows/tickets.yml@main
    secrets: inherit

  specs:
    uses: collod873/claude-workflow/.github/workflows/specs.yml@main
    secrets: inherit
