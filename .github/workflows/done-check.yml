name: Done check
run-name: "${{ github.event_name == 'push' && 'Done check of each open spec still marked asked' || format('Done check #{0}: {1}', github.event.issue.number, github.event.issue.title) }}"

"on":
  issue_comment:
    types: [created]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  asked:
    if: ${{ github.event_name == 'push' || github.event.sender.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      asked: ${{ steps.asked.outputs.asked }}
      marked: ${{ steps.marked.outputs.marked }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          spec=$(bin/spelled SPEC)
          paused=$(bin/spelled PAUSED)
          stuck=$(bin/spelled STUCK)
          held=$(jq --arg SPEC "$spec" --arg PAUSED "$paused" --arg STUCK "$stuck" 'any(.issue.labels[]?.name; . == $SPEC) and (any(.issue.labels[]?.name; . == $PAUSED or . == $STUCK) | not)' "$GITHUB_EVENT_PATH")
          printf 'held=%s\n' "$held" | tee -a "$GITHUB_OUTPUT"

      - id: asked
        if: steps.labelled.outputs.held == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asked=$(bin/done-check ${{ github.event.issue.number }} --asked)
          printf 'asked=%s\n' "$asked" >>"$GITHUB_OUTPUT"

      - id: marked
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          marked=$(gh issue list --state open --label "$(bin/spelled SPEC)" --label "$(bin/spelled ASKED)" --limit 100 --json number --jq '[.[].number]')
          printf 'marked=%s\n' "$marked" >>"$GITHUB_OUTPUT"

  check:
    needs: asked
    if: ${{ needs.asked.outputs.asked == 'true' || (needs.asked.outputs.marked != '' && needs.asked.outputs.marked != '[]') }}
    strategy:
      matrix:
        spec: ${{ fromJSON(needs.asked.outputs.asked == 'true' && format('[{0}]', github.event.issue.number) || needs.asked.outputs.marked) }}
    concurrency:
      group: done-check-${{ matrix.spec }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: npm-ci
        run: npm ci

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: done-check
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/done-check-${{ matrix.spec }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          bin/done-check ${{ matrix.spec }}

      - if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/call-owner
        with:
          issue: ${{ matrix.spec }}
          run: the done check run

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
