name: Acceptance
run-name: "Acceptance #${{ github.event.client_payload.issue || github.event.issue.number }}"

"on":
  issues:
    types: [edited]
  repository_dispatch:
    types: [acceptance-wanted]

jobs:
  acceptance:
    permissions:
      contents: write
      issues: write
      actions: read
    uses: collod873/claude-workflow/.github/workflows/acceptance.yml@main
    secrets: inherit
