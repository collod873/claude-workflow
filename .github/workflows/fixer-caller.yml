name: Fixer

"on":
  repository_dispatch:
    types: [fixer-needed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "A completed Verify run to react to. Empty resolves no pull request and exits."
        required: false
        default: ""

jobs:
  fixer:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    uses: collod873/claude-workflow/.github/workflows/fixer.yml@main
    with:
      run_id: ${{ github.event.client_payload.run_id || github.event.inputs.run_id }}
      test_dir: .Workflow
    secrets: inherit
