name: Fixer

# Not "six lines with nothing in them" the way `verify-caller.yml` is (ADR-0055, amended by
# ADR-0132): `workflow_run` cannot be parameterized through `workflow_call`, so the routing
# decision `fixer.yml`'s own job `if:` used to make — which of its three doors fired, and whether
# the run behind it is one worth reacting to — has to live here now, on the file GitHub can
# actually see the doors ring. Only the run id it resolves crosses into the reusable workflow, as
# a `workflow_call` input; `fixer.yml`'s own header carries the rest of the reasoning this file
# used to carry directly.

"on":
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  # The door lane 06 rings itself, from its own `Signal the fixer` job — see `verify.yml` for why
  # `workflow_run` alone was not enough, and `implement.yml`/`recover-caller.yml` (ADR-0114) for
  # the same pattern one lane earlier. `types:` names this lane's one action (ADR-0090).
  repository_dispatch:
    types: [fixer-needed]
  # The hand door. A `workflow_run` trigger cannot be fired by a person, so without this there is
  # no way to run this lane at a pull request whose Verify went red before this file existed, no
  # way to retry one after the cause was dealt with by hand — and, the reason #183 exists, no way
  # to find out whether this lane runs at all short of waiting for the next real failure.
  workflow_dispatch:
    inputs:
      run_id:
        description: "A completed Verify run to react to. Empty resolves no pull request and exits."
        required: false
        default: ""

jobs:
  fixer:
    # The same union `fixer.yml`'s job `if:` carried before the split. `event != 'push'` is not
    # cosmetic: `verify-caller.yml` fires on `push: main` as well as on the implementer's dispatch,
    # and a red push run is trunk being broken — there is no pull request to fix, no branch to push
    # attempts to, and nothing this lane could do but spend a model on `main`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'fixer-needed' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'push')
    uses: collod873/claude-workflow/.github/workflows/fixer.yml@main
    with:
      # The same `||` chain `fixer.yml`'s own `RUN_ID` used to resolve directly — whichever of the
      # three doors fired is the one with a value here.
      run_id: ${{ github.event.workflow_run.id || github.event.client_payload.run_id || github.event.inputs.run_id }}
    # A `uses:` job passes no secret to the reusable workflow unless told to — `fixer.yml` spends
    # `CLAUDE_CODE_OAUTH_TOKEN` on its model path, so without this its preflight fails closed on
    # every run.
    secrets: inherit
