name: Mechanic (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: implement-${{ github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  mechanic:
    if: github.event.action == 'mechanic-wanted'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      TICKET_NUMBER: ${{ github.event.client_payload.issue }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Preflight, CLAUDE_CODE_OAUTH_TOKEN is set
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty: set the repository secret before the mechanic can run." >&2
            exit 1
          fi

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Mark the ticket running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "on"

      - name: Repair the ticket's cause
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: |
          echo "mechanic on #$TICKET_NUMBER"
          npx tsx .Workflow/agent-workflows/mechanic/mechanic.ts "$TICKET_NUMBER"

      - name: Unmark the ticket
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "off"

      - name: Wake the reconciler, whatever ended this run
        if: always()
        run: |
          set -euo pipefail
          gh api --method POST 'repos/{owner}/{repo}/dispatches' \
            -f event_type=run-ended \
            -f "client_payload[run_id]=$GITHUB_RUN_ID"
