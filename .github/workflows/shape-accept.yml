name: Shape — accept (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  issues: write

concurrency:
  group: shape-accept-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  accept:
    if: >-
      github.event.label.name == 'approved' ||
      github.event.label.name == 'parked' ||
      github.event.label.name == 'killed'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      IDEA_NUMBER: ${{ github.event.issue.number }}
      VERB: ${{ github.event.label.name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Configure a committer
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Accept
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/shape/run-accept.ts --issue "$IDEA_NUMBER" --verb "$VERB"

      - name: Report failure
        if: ${{ !success() }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # shellcheck disable=SC2016  # the backticks are Markdown for the issue comment, not command substitution
          body=$(printf 'The `%s` accept did not finish.\n\nNothing here is automatic to recover: check whether `docs/adr/` and `CONTEXT.md` took the writes before re-applying the label.\n\n**Workflow run:** %s\n' "$VERB" "$run_url")
          gh issue comment "$IDEA_NUMBER" --body "$body"
