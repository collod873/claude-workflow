name: Shape — accept (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  issues: write

concurrency:
  group: shape-accept-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      IDEA_NUMBER: ${{ github.event.issue.number }}
      VERB: ${{ github.event.label.name }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Configure a committer
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Accept
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/shape/run-accept.ts --issue "$IDEA_NUMBER" --verb "$VERB"

      - name: Report failure
        if: always()
        env:
          REPORT_LANE: shape-accept
          REPORT_ISSUE: ${{ env.IDEA_NUMBER }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERB: ${{ env.VERB }}
          REPORT_REFUSED: "false"
        run: npx tsx .Workflow/agent-workflows/shared/report-lane-failure.ts
