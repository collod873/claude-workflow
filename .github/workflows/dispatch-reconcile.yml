name: Dispatch reconcile (reusable)

"on":
  workflow_call:
    inputs:
      verify_workflow:
        type: string
        required: true
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: dispatch-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      EVENT_ACTION: ${{ (github.event_name == 'repository_dispatch' && github.event.action) || (github.event_name == 'workflow_run' && 'run-ended') || (github.event_name == 'push' && 'main-moved') || (github.event_name == 'issues' && github.event.action == 'unlabeled' && 'graph-changed') || 'session-captured' }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ISSUE_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFY_WORKFLOW: ${{ inputs.verify_workflow }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Recompute the ready set
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/dispatch/reconcile.ts
