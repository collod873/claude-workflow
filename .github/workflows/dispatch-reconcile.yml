name: Dispatch reconcile

# Lane 09: readiness is recomputed, not pushed (#179).
#
# `dispatchReadySlices` answered readiness once, at publish, with `dependsOn.length === 0` — a
# constant folded into a predicate that really asks *every blocker delivered*. Folded, it could only
# be answered once, so nothing sent the second wave and a 26-slice plan started its roots and
# stopped. This is the unfolded predicate, run again: it recomputes the ready set across the tracker
# from durable state alone and dispatches `ticket-ready` for everything in it that has not been
# started.
#
# It fires on two actions and they are not equals. `session-captured` is the **correctness floor**:
# the dependency graph, every blocker's close state and every slice's branch are durable API
# objects, so the ready set is a pure function of state that is still there tomorrow — there is
# nothing to replay and nothing to reconstruct, which is ADR-0049's real criterion met more
# completely than the close gate's reconciler can meet it. `graph-changed` is a **latency hint**
# that lane 08 rings after a merge; lose it and this still finds the same ready set at the next
# session end, so the cost is minutes rather than the wave. That asymmetry is why a second dispatch
# is permitted here when ADR-0049 refused one — its dispatch would have been load-bearing.
#
# Riding session end is ADR-0004 applied rather than excepted: a slice can only become ready if a
# merge happened, and merges only happen during work, so this cannot fire against nothing. A cron
# is refused on ADR-0048's evidence unchanged — GitHub throttles scheduled runs under the same load
# being reconciled against.
#
# `types:` names both of this lane's actions, for the reason `audit.yml` gives and ADR-0090 rules —
# an unfiltered trigger wakes every dispatch-triggered workflow on every dispatch any lane sends,
# and the skipped runs that produces are what made the acting lanes unreadable in the run history.
# This is the one workflow whose list is genuinely two entries long, which is the case the old
# argument was built around; two entries that `reconcile.test.ts` holds to `RECONCILE_DISPATCH_ACTIONS`
# is a cheaper thing to keep true than a history nobody can read. The job-level `if` is still the
# scope rule, spelled here and in `reconcile.ts`'s `RECONCILE_DISPATCH_ACTIONS`.
#
# **Lane 08 never reads the graph and this never writes it.** The doorbell says "something changed,
# go look" and nothing else, and the only reader is this — so ADR-0069 is applied, not amended, and
# there is no second writer.
#
# The third trigger, `issues: labeled` on the caller, is lane 06's second door (#184): the owner
# labelling an already-written ticket `to-build`, so small work skips the spec chain without
# skipping any gate. It **enters the recompute** rather than firing its own dispatch, which is the
# whole reason it rides this workflow instead of a new one — a labelled ticket with open blockers is
# simply not in the ready set, and the next `session-captured` finds it. A one-shot dispatch at
# label time would start a blocked ticket immediately, or never start it once its blockers cleared,
# which is #179 rebuilt inside the new door.
#
# It is gated on the sender being the repository owner for the reason `spec.yml` and `shape.yml`
# carry the identical gate: this repository is public, so a label can arrive from anyone, where a
# `repository_dispatch` can only be sent by something already holding a token here. The label
# string is spelled here and in `reconcile.ts`'s `TO_BUILD_LABEL`, and `reconcile.test.ts` holds
# the two together.
#
# ADR-0055 (amended by ADR-0132): this is a *reusable* workflow — `on: workflow_call` — so a caller
# repository carries only `dispatch-reconcile-caller.yml`, a trigger and a `uses:`, never a copy of
# the machine. This repository is its own first caller: the caller stub lives next to this file, at
# the same commit, so the bytes shipped are the bytes that run. Two checkouts below —
# `collod873/claude-workflow` (the machine, for the script) and the calling repository's own tree
# (the target) — never one copy standing in for the other, even though this reconciler reads
# neither tree directly: it recomputes the ready set over the target's tracker and sends the wave
# entirely through `gh`, scoped by `GH_REPO` rather than by cwd. The machine checkout carries no
# credential input of its own: ADR-0132 made this repository public, so `actions/checkout` reads it
# anonymously and no PAT is added here that would have to be rotated in every enrolled repository.

"on":
  workflow_call:
    inputs:
      # `reconcile.ts`'s `runRealSpecClose` shells to this repository's own `bin/close-ticket
      # --spec`, which reads Verify's verdict on the pull request that closed each delivered
      # child — the same workflow-file fact `integrate.yml` threads through for the same reason.
      # Required, no default: see `integrate.yml`'s own `verify_workflow` input.
      verify_workflow:
        type: string
        required: true

permissions:
  # `contents: write` is for the `repository_dispatch` this sends, not for the tree: creating a
  # dispatch event needs write access to contents, and this workflow pushes nothing. `read` here
  # would 403 on the one write that matters and report `clear` on a run that dispatched nothing.
  contents: write
  # Filing the unreachable count as one standing issue, and reading the tracker it reconciles.
  issues: write

# Serialised rather than cancelled: a merge and a session ending together would otherwise both
# recompute the same ready set, and a run cancelled mid-reconcile would leave half the graph
# unconsidered while reporting green. Duplicate dispatch is free — the implementer's branch ref is
# the claim — so this is about the report being whole, not about the sends racing.
concurrency:
  group: dispatch-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'session-captured' ||
      github.event.action == 'graph-changed' ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'to-build' &&
       github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A `repository_dispatch` names its own action; nothing else here has one to name. A manual
      # run is a person asking and a `to-build` label is the owner asserting intent to build, both
      # of which are as much an event as a dispatch is — so each declares the floor rather than
      # teaching the entrypoint a second way to be allowed to run. `github.event.action` on the
      # label event is `labeled`, which `RECONCILE_DISPATCH_ACTIONS` does not carry and `main()`
      # would refuse; the point of the fallback is that it never reaches the entrypoint.
      EVENT_ACTION: ${{ (github.event_name == 'repository_dispatch' && github.event.action) || 'session-captured' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Inherited by the `bin/close-ticket --spec` child process `reconcile.ts` shells to — see
      # this file's `workflow_call.inputs` above.
      VERIFY_WORKFLOW: ${{ inputs.verify_workflow }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      # No Claude Code install and no model secret: this spends nothing. It reads the tracker and
      # the refs API, sends dispatches, and files at most one comment — every write through the `gh`
      # seam in `shared/gh.ts`. Exits nonzero only when it could not read its own inputs.
      - name: Recompute the ready set
        env:
          # Which checkout a spec's own `check:` command runs against, and which one
          # `bin/close-ticket --spec` closes (ADR-0055) — without this, `reconcile.ts` falls back
          # to `process.cwd()` and runs both against the machine checkout instead of the target's.
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/dispatch/reconcile.ts
