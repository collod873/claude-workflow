name: Ratify (caller)

"on":
  repository_dispatch:
    types: [ratification-due]

jobs:
  ratify:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: collod873/claude-workflow/.github/workflows/ratify.yml@main
    # A `uses:` job passes no secret to the reusable workflow unless told to — `ratify.yml` spends
    # `CLAUDE_CODE_OAUTH_TOKEN`, so without this its preflight fails closed on every run.
    secrets: inherit
