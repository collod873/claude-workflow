name: Acceptance (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: acceptance-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  refire:
    if: >-
      contains(github.event.issue.labels.*.name, 'prd') &&
      github.event.sender.login == github.repository_owner
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      authored: ${{ steps.bundle.outputs.authored }}
    env:
      PRD_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ACCEPTANCE_LANDING: commit
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Note the commit this run starts from
        working-directory: target
        run: echo "ACCEPTANCE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Re-fire acceptance for affected slices
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/acceptance/acceptance.ts --refire "$PRD_NUMBER"

      - name: Bundle the authored commits
        id: bundle
        uses: ./.github/actions/acceptance-bundle
        with:
          working-directory: target

  author:
    if: github.event.action == 'acceptance-wanted'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      authored: ${{ steps.bundle.outputs.authored }}
    env:
      TICKET_NUMBER: ${{ github.event.client_payload.issue }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ACCEPTANCE_LANDING: commit
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Note the commit this run starts from
        working-directory: target
        run: echo "ACCEPTANCE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Mark the ticket running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "on"

      - name: Author acceptance tests for the published slice
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/acceptance/acceptance.ts "$TICKET_NUMBER"

      - name: Bundle the authored commits
        id: bundle
        uses: ./.github/actions/acceptance-bundle
        with:
          working-directory: target

      - name: Unmark the ticket
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "off"

  land:
    name: Land on main
    needs: [refire, author]
    if: >-
      always() &&
      ((needs.refire.result == 'success' && needs.refire.outputs.authored == 'true') ||
      (needs.author.result == 'success' && needs.author.outputs.authored == 'true'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          ref: main
          fetch-depth: 0

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        working-directory: target
        run: npm ci

      - name: Download the authored commits
        uses: actions/download-artifact@v4
        with:
          name: acceptance-commits
          path: ${{ runner.temp }}/acceptance-patches

      - name: Replay them onto main
        working-directory: target
        run: |
          set -euo pipefail
          git am --3way "$RUNNER_TEMP"/acceptance-patches/*.patch
          git fetch origin main
          git rebase origin/main

      - name: Gauntlet
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npm run check

      - name: Push to main
        working-directory: target
        run: git push origin HEAD:main

      - name: Tell lane 05 this slice is ready
        if: github.event.action == 'acceptance-wanted' && github.event.client_payload.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST 'repos/{owner}/{repo}/dispatches' \
            -f event_type=ticket-ready \
            -f "client_payload[issue]=${{ github.event.client_payload.issue }}"
