name: Acceptance (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: acceptance-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  refire:
    if: >-
      contains(github.event.issue.labels.*.name, 'prd') &&
      github.event.sender.login == github.repository_owner
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      authored: ${{ steps.bundle.outputs.authored }}
    env:
      PRD_NUMBER: ${{ github.event.issue.number }}
      PRD_BODY_BEFORE: ${{ github.event.changes.body.from }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ACCEPTANCE_LANDING: commit
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Note the commit this run starts from
        working-directory: target
        run: echo "ACCEPTANCE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Re-fire acceptance for affected slices
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/acceptance/acceptance.ts --refire "$PRD_NUMBER"

      - name: Bundle the authored commits
        id: bundle
        uses: ./.github/actions/acceptance-bundle
        with:
          working-directory: target

  author:
    if: github.event.action == 'acceptance-wanted'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      authored: ${{ steps.bundle.outputs.authored }}
    env:
      TICKET_NUMBER: ${{ github.event.client_payload.issue }}
      PRD_BODY_BEFORE: ${{ github.event.changes.body.from }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ACCEPTANCE_LANDING: commit
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Note the commit this run starts from
        working-directory: target
        run: echo "ACCEPTANCE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Mark the ticket running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "on"

      - name: Author acceptance tests for the published slice
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/acceptance/acceptance.ts "$TICKET_NUMBER"

      - name: Bundle the authored commits
        id: bundle
        uses: ./.github/actions/acceptance-bundle
        with:
          working-directory: target

      - name: Unmark the ticket
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "off"

  land:
    name: Land on main
    needs: [refire, author]
    if: >-
      always() &&
      ((needs.refire.result == 'success' && needs.refire.outputs.authored == 'true') ||
      (needs.author.result == 'success' && needs.author.outputs.authored == 'true'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    concurrency:
      group: land-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          ref: main
          fetch-depth: 0

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Download the authored commits
        uses: actions/download-artifact@v4
        with:
          name: acceptance-commits
          path: ${{ runner.temp }}/acceptance-patches

      - name: Replay them onto main
        id: replay
        working-directory: target
        run: |
          set -euo pipefail
          conflicted() { echo "conflict=true" >> "$GITHUB_OUTPUT"; exit 1; }
          git am --3way "$RUNNER_TEMP"/acceptance-patches/*.patch || conflicted
          git fetch origin main
          git rebase origin/main || conflicted

      - name: Gauntlet
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npm run check

      - name: Push to main, refreshed against whatever landed during the gauntlet
        id: push
        working-directory: target
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { echo "conflict=true" >> "$GITHUB_OUTPUT"; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Author again against the main that moved, once
        if: >-
          failure() && github.event.action == 'acceptance-wanted' &&
          (steps.replay.outputs.conflict == 'true' || steps.push.outputs.conflict == 'true') &&
          github.event.client_payload.refire != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TICKET_NUMBER: ${{ github.event.client_payload.issue }}
          READY: ${{ github.event.client_payload.ready }}
        run: |
          set -euo pipefail
          gh issue comment "$TICKET_NUMBER" --body "The authored tests were judged green, but a sibling's batch landed on main first and replaying them conflicted, so the author runs once more against the main that moved. A second conflict waits for a human. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST 'repos/{owner}/{repo}/dispatches' \
            -f event_type=acceptance-wanted \
            -f "client_payload[issue]=$TICKET_NUMBER" \
            -f "client_payload[ready]=$READY" \
            -f "client_payload[refire]=1"

      - name: Say on the ticket that landing failed, and wait for a human
        if: >-
          failure() && github.event.action == 'acceptance-wanted' &&
          (github.event.client_payload.refire == '1' ||
          !(steps.replay.outputs.conflict == 'true' || steps.push.outputs.conflict == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TICKET_NUMBER: ${{ github.event.client_payload.issue }}
        run: |
          set -euo pipefail
          gh label create needs-human --color d93f0b \
            --description "Ticket stalled; a human decision or action is required" --force
          gh issue edit "$TICKET_NUMBER" --add-label needs-human
          gh issue comment "$TICKET_NUMBER" --body "The authored tests were judged green in the author job, but landing them on main failed, so nothing landed and this ticket is waiting on a human. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Tell lane 05 this slice is ready
        if: github.event.action == 'acceptance-wanted' && github.event.client_payload.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST 'repos/{owner}/{repo}/dispatches' \
            -f event_type=ticket-ready \
            -f "client_payload[issue]=${{ github.event.client_payload.issue }}"

  wake-reconciler:
    name: Wake the reconciler
    needs: [refire, author, land]
    if: always() && (needs.refire.result != 'skipped' || needs.author.result != 'skipped')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Wake the reconciler, whatever ended this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST 'repos/{owner}/{repo}/dispatches' \
            -f event_type=run-ended \
            -f "client_payload[run_id]=$GITHUB_RUN_ID"
