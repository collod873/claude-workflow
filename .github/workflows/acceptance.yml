name: Acceptance (reusable)

"on":
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  issues: write

concurrency:
  group: acceptance-${{ github.event.issue.number || github.event.client_payload.issue }}
  cancel-in-progress: false

jobs:
  refire:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      authored: ${{ steps.bundle.outputs.authored }}
    env:
      PRD_NUMBER: ${{ github.event.issue.number }}
      PRD_BODY_BEFORE: ${{ github.event.changes.body.from }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ACCEPTANCE_LANDING: commit
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Note the commit this run starts from
        working-directory: target
        run: echo "ACCEPTANCE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Re-fire acceptance for affected slices
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/acceptance/acceptance.ts --refire "$PRD_NUMBER"

      - name: Bundle the authored commits
        id: bundle
        uses: ./.github/actions/acceptance-bundle
        with:
          working-directory: target

  author:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      authored: ${{ steps.bundle.outputs.authored }}
    env:
      TICKET_NUMBER: ${{ github.event.client_payload.issue }}
      PRD_BODY_BEFORE: ${{ github.event.changes.body.from }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
      EVENT_SENDER: ${{ github.event.sender.login }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ACCEPTANCE_LANDING: commit
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Note the commit this run starts from
        working-directory: target
        run: echo "ACCEPTANCE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Mark the ticket running
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "on"

      - name: Author acceptance tests for the published slice
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/acceptance/acceptance.ts "$TICKET_NUMBER"

      - name: Bundle the authored commits
        id: bundle
        uses: ./.github/actions/acceptance-bundle
        with:
          working-directory: target

      - name: Unmark the ticket
        if: always()
        uses: ./.github/actions/running-label
        with:
          issue: ${{ env.TICKET_NUMBER }}
          mode: "off"

  land:
    name: Land on main
    needs: [refire, author]
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    concurrency:
      group: land-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      actions: read
    env:
      REFIRE_RESULT: ${{ needs.refire.result }}
      REFIRE_AUTHORED: ${{ needs.refire.outputs.authored }}
      AUTHOR_RESULT: ${{ needs.author.result }}
      AUTHOR_AUTHORED: ${{ needs.author.outputs.authored }}
      EVENT_ACTION: ${{ github.event.action }}
      TICKET_NUMBER: ${{ github.event.client_payload.issue }}
      READY: ${{ github.event.client_payload.ready }}
      REFIRED: ${{ github.event.client_payload.refire }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          ref: main
          fetch-depth: 0

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        uses: ./.github/actions/target-deps
        with:
          working-directory: target

      - name: Land whatever the authoring jobs authored
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/acceptance/land.ts

  wake-reconciler:
    name: Wake the reconciler
    needs: [refire, author, land]
    if: always()
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Wake the reconciler, whatever ended this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST 'repos/{owner}/{repo}/dispatches' \
            -f event_type=run-ended \
            -f "client_payload[run_id]=$GITHUB_RUN_ID"
