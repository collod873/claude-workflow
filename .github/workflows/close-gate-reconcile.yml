name: Close gate reconcile

# The close gate's own blind spot, closed after the fact (#106, DESIGN.md §09).
#
# `close-gate.yml` fires on `issues.closed`, and GitHub does not replay an event a workflow
# missed. A close that lands while Actions is down produces no run, no verdict and no
# `close-refused` — and is indistinguishable from a close that passed. This asks the question that
# is still answerable a day later, entirely from durable state: which completed closes have no
# gate run? What it finds, it reopens.
#
# This is not #41's watchdog and does not retire it. A watchdog has to run *during* the failure,
# and the failure here is Actions not running workflows — it would be down with everything else. A
# reconciler only has to run after, which is what makes being asleep through the outage cost it
# nothing.
#
# It rides `session-captured` rather than a clock, which is ADR-0004 applied rather than excepted:
# a session that ended is work that happened, and closes only arrive during work, so this cannot
# fire against nothing. On 2026-08-26 the observed failure was a throttled Actions queue rather
# than a dropped one — and GitHub's scheduler is throttled by the same incident, so a cron would
# have been late in precisely the window it was meant to cover. ADR-0048.
#
# `repository_dispatch` is left unfiltered by `types:` for the reason `audit.yml` gives: the
# filter is per-workflow, not per-job, so a sibling sharing this trigger surface would force this
# file's list to track every action any of them ever adds. The job-level `if` is the scope rule,
# spelled here and in `reconcile.ts`'s `RECONCILE_DISPATCH_ACTION`; `reconcile.test.ts` asserts
# the two still agree.
#
# Reopening is the whole report. A reconciler whose output is a line in a log is the second gate
# nobody watches — an issue back on the open list is not.

"on":
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialised rather than cancelled: two sessions ending together would otherwise both read the
# same unjudged close and both comment on it, and a run cancelled mid-sweep would leave half the
# window unreconciled while reporting green.
concurrency:
  group: close-gate-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'session-captured'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A manual run is a person asking, which is as much an event as a dispatch is — it carries
      # no `github.event.action`, so it declares the same one rather than teaching the entrypoint
      # a second way to be allowed to run.
      EVENT_ACTION: ${{ github.event_name == 'workflow_dispatch' && 'session-captured' || github.event.action }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # No Claude Code install and no model secret: this spends nothing. It reads the tracker and
      # the Actions log and reopens what it finds, and every write goes through the `gh` seam in
      # `shared/gh.ts` — so there is no separate reporting step and no way for a reopen to
      # half-land. Exits nonzero only when it could not read its own inputs.
      - name: Reconcile unjudged closes
        run: npx tsx .Workflow/agent-workflows/close-gate/reconcile.ts
