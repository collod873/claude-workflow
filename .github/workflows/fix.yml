name: Fix

"on":
  workflow_run:
    workflows: [Build, Check]
    types: [completed]
  issues:
    types: [reopened]

permissions:
  contents: read

jobs:
  which:
    if: ${{ (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'issues' && github.event.sender.type == 'Bot' && !contains(github.event.issue.labels.*.name, 'note')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ticket: ${{ steps.which.outputs.ticket }}
    steps:
      - id: which
        env:
          ISSUE: ${{ github.event.issue.number }}
          RAN: ${{ github.event.workflow_run.path }}
          RAN_ON: ${{ github.event.workflow_run.head_branch }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          ticket=$ISSUE
          [[ $RAN == .github/workflows/check.yml && $RAN_ON =~ ^ticket/([0-9]+)$ ]] && ticket=${BASH_REMATCH[1]}
          [[ $RAN == .github/workflows/build.yml && $TITLE =~ ^Build\ ticket/([0-9]+): ]] && ticket=${BASH_REMATCH[1]}
          printf 'ticket=%s\n' "$ticket" >>"$GITHUB_OUTPUT"

  fix:
    needs: which
    if: ${{ needs.which.outputs.ticket != '' }}
    concurrency:
      group: fix-${{ needs.which.outputs.ticket }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      TICKET: ${{ needs.which.outputs.ticket }}
      HEAD_REF: ticket/${{ needs.which.outputs.ticket }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - id: branch
        env:
          EVENT: ${{ github.event_name }}
          RAN: ${{ github.event.workflow_run.path }}
          RAN_AT: ${{ github.event.workflow_run.head_sha }}
          ENDED: ${{ github.event.workflow_run.updated_at }}
        run: |
          git config user.name "core-app[bot]"
          git config user.email "core-app[bot]@users.noreply.github.com"
          if ! git fetch --quiet origin "$HEAD_REF" 2>/dev/null || git merge-base --is-ancestor FETCH_HEAD origin/main; then
            git checkout --quiet -B "$HEAD_REF" origin/main
            exit 0
          fi
          git checkout --quiet -B "$HEAD_REF" FETCH_HEAD
          [[ $EVENT == workflow_run ]] || exit 0
          if [[ $RAN == .github/workflows/check.yml && $(git rev-parse HEAD) != "$RAN_AT" ]] || [[ $RAN == .github/workflows/build.yml && $(git log -1 --format=%ct HEAD) -gt $(date -d "$ENDED" +%s) ]]; then
            printf 'fix: %s moved since run %s went red, so a newer run judges it\n' "$HEAD_REF" "$RAN"
            echo stale=true >>"$GITHUB_OUTPUT"
          fi

      - id: setup-node
        if: steps.branch.outputs.stale != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: npm-ci
        if: steps.branch.outputs.stale != 'true'
        run: npm ci

      - id: stage
        if: steps.branch.outputs.stale != 'true'
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: logs
        if: steps.branch.outputs.stale != 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN" --name machine-logs --dir .git/machine-logs || true

      - id: restore
        if: steps.branch.outputs.stale != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/fixer
          key: fixer-${{ env.HEAD_REF }}-${{ github.run_id }}
          restore-keys: fixer-${{ env.HEAD_REF }}-

      - id: fix
        if: steps.branch.outputs.stale != 'true'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          tail --pid=$$ -n +1 -F ".git/machine-logs/fix-$TICKET.jsonl" 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          bin/fix "$TICKET" $RUN

      - if: always() && steps.fix.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/fixer
          key: fixer-${{ env.HEAD_REF }}-${{ github.run_id }}

      - if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue view "$TICKET" --json labels --jq '.labels[].name' | grep -qx needs-human && exit 0
          gh issue edit "$TICKET" --add-label needs-human
          gh issue comment "$TICKET" --body "@${{ github.repository_owner }} the fixer's job ended before the fixer could finish, see the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
