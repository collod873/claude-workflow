name: Bypass counter (reusable)

"on":
  workflow_call:
    inputs:
      verify_workflow:
        type: string
        required: true
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: bypass-counter
  cancel-in-progress: false

jobs:
  count:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFY_WORKFLOW: ${{ inputs.verify_workflow }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Count bypasses of the free gates
        run: npx tsx .Workflow/agent-workflows/watchdog/bypass-counter.ts
