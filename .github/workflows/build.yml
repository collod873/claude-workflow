name: Build
run-name: "Build #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"

"on":
  issues:
    types: [opened, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  build:
    if: "${{ github.event.sender.login == github.repository_owner || (github.event.sender.login == 'collod873-machine[bot]' && (github.event.action == 'unlabeled' || github.event.action == 'opened')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    cache-mode: write
    permissions:
      contents: read
      issues: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: labelled
        run: |
          waiting=$(bin/spelled WAITING)
          note=$(bin/spelled NOTE)
          spec=$(bin/spelled SPEC)
          paused=$(bin/spelled PAUSED)
          stuck=$(bin/spelled STUCK)
          jq -r --arg WAITING "$waiting" --arg NOTE "$note" --arg SPEC "$spec" --arg PAUSED "$paused" --arg STUCK "$stuck" '
            (any(.issue.labels[]?.name; IN($NOTE, $SPEC)) | not) as $ticket
            | (any(.issue.labels[]?.name; IN($WAITING, $PAUSED, $STUCK)) | not) as $free
            | (.action == "unlabeled" and IN(.label.name; $PAUSED, $STUCK) and .issue.state != "closed" and $ticket and $free) as $resumed
            | "held=\(((.action == "opened" or .action == "reopened" or (.action == "unlabeled" and .label.name == $WAITING)) and $ticket and $free) or $resumed)",
              "resumed=\($resumed)",
              "paused=\(.action == "labeled" and .label.name == $PAUSED and $ticket)"
          ' "$GITHUB_EVENT_PATH" | tee -a "$GITHUB_OUTPUT"

      - id: npm-ci
        if: steps.labelled.outputs.held == 'true'
        run: npm ci

      - id: stage
        if: steps.labelled.outputs.held == 'true'
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: admit
        if: steps.labelled.outputs.held == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bin/admit ${{ github.event.issue.number }} >>"$GITHUB_OUTPUT"

      - id: git-config
        if: steps.labelled.outputs.held == 'true'
        run: |
          git config user.name "core-app[bot]"
          git config user.email "core-app[bot]@users.noreply.github.com"

      - id: resume
        if: steps.labelled.outputs.resumed == 'true' && steps.admit.outputs.admitted == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: 'bin/resume ${{ github.event.issue.number }} >>"$GITHUB_OUTPUT"'

      - id: start
        if: steps.labelled.outputs.held == 'true' && (steps.admit.outputs.admitted == 'true' && steps.resume.outputs.builds != 'false')
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="$(bin/spelled TICKET_PREFIX)${{ github.event.issue.number }}"
          printf 'branch=%s\n' "$branch" >>"$GITHUB_OUTPUT"
          checking=$(bin/spelled CHECKING)
          building=$(bin/spelled BUILDING)
          if [[ '${{ github.event.action }}' == reopened ]] && state=$(gh pr view "$branch" --json state --jq .state 2>/dev/null) && [[ $state == OPEN ]]; then # quiet: a ticket with no PR yet builds
            gh pr checks "$branch" --json name,bucket,link \
              | jq -r '.[] | select(.bucket == "fail") | .link' \
              | sed -E 's#.*/runs/([0-9]+)/.*#\1#' \
              | sort -u \
              | while read -r run; do gh run rerun "$run" --failed; done
            bin/mark ${{ github.event.issue.number }} "$checking"
            echo rerun=true >>"$GITHUB_OUTPUT"
          elif [[ '${{ github.event.action }}' == reopened ]]; then
            bin/mark ${{ github.event.issue.number }} "$building" --try
          else
            bin/mark ${{ github.event.issue.number }} "$building"
          fi

      - id: fix
        if: steps.labelled.outputs.held == 'true' && (steps.admit.outputs.admitted == 'true' && steps.resume.outputs.builds != 'false' && steps.start.outputs.rerun != 'true')
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
          BRANCH: ${{ steps.start.outputs.branch }}
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/fix-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          git checkout --quiet -b "$BRANCH"
          bin/fix ${{ github.event.issue.number }}

      - id: pause
        if: steps.labelled.outputs.paused == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bin/pause ${{ github.event.issue.number }}

      - if: ${{ steps.labelled.outputs.held != 'false' && (always() && steps.fix.outcome != 'skipped') }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/builder
          key: builder-${{ steps.start.outputs.branch }}-${{ github.run_id }}

      - if: always() && steps.labelled.outputs.held != 'false'
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
