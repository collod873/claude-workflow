name: Build
run-name: "Build ticket/${{ github.event.issue.number }}: ${{ github.event.issue.title }}"

"on":
  issues:
    types: [opened, reopened, unlabeled]

permissions:
  contents: read

jobs:
  build:
    if: "${{ (github.event.action != 'unlabeled' || github.event.label.name == 'waiting') && (github.event.sender.login == github.repository_owner || (github.event.sender.login == 'collod873-machine[bot]' && (github.event.action == 'unlabeled' || (github.event.action == 'opened' && contains(github.event.issue.body, 'Follow-up of #'))))) && !contains(github.event.issue.labels.*.name, 'note') && !contains(github.event.issue.labels.*.name, 'spec') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    cache-mode: write
    permissions:
      contents: read
      issues: read
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: npm-ci
        run: npm ci

      - id: stage
        uses: ./.github/actions/stage
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - id: git-config
        run: |
          git config user.name "core-app[bot]"
          git config user.email "core-app[bot]@users.noreply.github.com"

      - id: start
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="ticket/${{ github.event.issue.number }}"
          if [[ '${{ github.event.action }}' == reopened ]] && state=$(gh pr view "$branch" --json state --jq .state 2>/dev/null) && [[ $state == OPEN ]]; then
            gh pr checks "$branch" --json name,bucket,link \
              | jq -r '.[] | select(.bucket == "fail") | .link' \
              | sed -E 's#.*/runs/([0-9]+)/.*#\1#' \
              | sort -u \
              | while read -r run; do gh run rerun "$run" --failed; done
            echo rerun=true >>"$GITHUB_OUTPUT"
          else
            bin/mark ${{ github.event.issue.number }} 1-defining || true
          fi

      - id: fix
        if: steps.start.outputs.rerun != 'true'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 45
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/fix-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered -f "$FEED" &
          git checkout --quiet -b "ticket/${{ github.event.issue.number }}"
          bin/fix ${{ github.event.issue.number }}

      - if: always() && steps.fix.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.claude/projects
            ~/.claude/fixer
          key: fixer-ticket/${{ github.event.issue.number }}-${{ github.run_id }}

      - if: always()
        timeout-minutes: 6
        uses: ./.github/actions/stage-logs
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
