name: Build

"on":
  issues:
    types: [opened, reopened]

permissions:
  contents: read

env:
  FEED: >-
    fromjson? | if .type == "assistant" then .message.content[]? |
    if .type == "text" then "said: \(.text | split("\n")[0] | .[0:200])"
    elif .type == "tool_use" then "\(.name): \(.input | tostring | .[0:200])"
    else empty end
    elif .type == "result" then "ended \(.subtype) after \(.num_turns) turns, \(.duration_ms / 60000 | floor) min, $\(.total_cost_usd)"
    else empty end

jobs:
  build:
    if: ${{ github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'note') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm install --global @anthropic-ai/claude-code

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - id: hooks-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: collod873
          repositories: agent-hooks
          permission-contents: read

      - env:
          HOOKS_TOKEN: ${{ steps.hooks-app.outputs.token }}
        run: |
          hooks="$RUNNER_TEMP/agent-hooks"
          git clone --quiet --depth 1 "https://x-access-token:$HOOKS_TOKEN@github.com/collod873/agent-hooks" "$hooks"
          rm -rf "$hooks/.git"
          python3 "$hooks/hookcheck.py" --root "$hooks" --settings "$RUNNER_TEMP/unregistered.json" --emit-settings >"$RUNNER_TEMP/agent-hooks.json"
          printf 'AGENT_HOOKS_SETTINGS=%s\n' "$RUNNER_TEMP/agent-hooks.json" >>"$GITHUB_ENV"

      - run: |
          git config user.name "core-app[bot]"
          git config user.email "core-app[bot]@users.noreply.github.com"

      - id: start
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bin/start ${{ github.event.issue.number }}

      - id: test-author
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 17
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/test-author-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered "$FEED" &
          bin/test-author ${{ github.event.issue.number }}

      - id: build
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 27
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/build-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered "$FEED" &
          bin/build ${{ github.event.issue.number }}

      - if: always() && (steps.test-author.outcome != 'skipped' || steps.build.outcome != 'skipped')
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bin/save ${{ github.event.issue.number }}

      - if: failure()
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 25
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/fix-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered "$FEED" &
          node src/hand-off.ts ${{ github.event.issue.number }}

      - id: kb-app
        if: always()
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: collod873
          repositories: Knowledge-Base
          permission-contents: write

      - if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          KB_TOKEN: ${{ steps.kb-app.outputs.token }}
        run: |
          timeout 120 bash -c 'while pgrep -f "[c]apture[.]py" >/dev/null; do sleep 1; done' || true
          captured="$HOME/Claude Projects/Knowledge-Base/raw"
          [ -d "$captured" ] || exit 0
          kb="$RUNNER_TEMP/knowledge-base"
          git clone --quiet --depth 1 "https://x-access-token:$KB_TOKEN@github.com/collod873/Knowledge-Base" "$kb"
          git -C "$kb" config user.name "collod873-machine[bot]"
          git -C "$kb" config user.email "collod873-machine[bot]@users.noreply.github.com"
          cp -r "$captured/." "$kb/raw/"
          git -C "$kb" add raw
          git -C "$kb" commit --quiet -m "flush: stage captures from $GITHUB_REPOSITORY run $GITHUB_RUN_ID" || exit 0
          for attempt in 1 2 3; do
            git -C "$kb" pull --quiet --rebase origin main && git -C "$kb" push --quiet origin HEAD:main && exit 0
          done
          exit 1

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: machine-logs
          path: .git/machine-logs
          include-hidden-files: true

  fix:
    if: ${{ github.event.action == 'reopened' && github.event.sender.type == 'Bot' && !contains(github.event.issue.labels.*.name, 'note') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm install --global @anthropic-ai/claude-code

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - id: hooks-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: collod873
          repositories: agent-hooks
          permission-contents: read

      - env:
          HOOKS_TOKEN: ${{ steps.hooks-app.outputs.token }}
        run: |
          hooks="$RUNNER_TEMP/agent-hooks"
          git clone --quiet --depth 1 "https://x-access-token:$HOOKS_TOKEN@github.com/collod873/agent-hooks" "$hooks"
          rm -rf "$hooks/.git"
          python3 "$hooks/hookcheck.py" --root "$hooks" --settings "$RUNNER_TEMP/unregistered.json" --emit-settings >"$RUNNER_TEMP/agent-hooks.json"
          printf 'AGENT_HOOKS_SETTINGS=%s\n' "$RUNNER_TEMP/agent-hooks.json" >>"$GITHUB_ENV"

      - run: |
          git config user.name "core-app[bot]"
          git config user.email "core-app[bot]@users.noreply.github.com"
          git checkout -B "ticket/${{ github.event.issue.number }}"

      - timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STAGE_MINUTES: 25
        run: |
          tail --pid=$$ -n +1 -F .git/machine-logs/fix-${{ github.event.issue.number }}.jsonl 2>/dev/null | jq -Rr --unbuffered "$FEED" &
          node src/hand-off.ts ${{ github.event.issue.number }} 'Red on main after merge'

      - id: kb-app
        if: always()
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          owner: collod873
          repositories: Knowledge-Base
          permission-contents: write

      - if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          KB_TOKEN: ${{ steps.kb-app.outputs.token }}
        run: |
          timeout 120 bash -c 'while pgrep -f "[c]apture[.]py" >/dev/null; do sleep 1; done' || true
          captured="$HOME/Claude Projects/Knowledge-Base/raw"
          [ -d "$captured" ] || exit 0
          kb="$RUNNER_TEMP/knowledge-base"
          git clone --quiet --depth 1 "https://x-access-token:$KB_TOKEN@github.com/collod873/Knowledge-Base" "$kb"
          git -C "$kb" config user.name "collod873-machine[bot]"
          git -C "$kb" config user.email "collod873-machine[bot]@users.noreply.github.com"
          cp -r "$captured/." "$kb/raw/"
          git -C "$kb" add raw
          git -C "$kb" commit --quiet -m "flush: stage captures from $GITHUB_REPOSITORY run $GITHUB_RUN_ID" || exit 0
          for attempt in 1 2 3; do
            git -C "$kb" pull --quiet --rebase origin main && git -C "$kb" push --quiet origin HEAD:main && exit 0
          done
          exit 1

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: machine-logs
          path: .git/machine-logs
          include-hidden-files: true
