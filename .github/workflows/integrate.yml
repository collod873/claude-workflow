name: Integrate

# Lane 08 (PRD #145, move 7): the merge actor, with no model in it. Fires on the same
# `repository_dispatch` an implementer's `openPrAndDispatch` sends after opening a pull request
# (`VERIFY_DISPATCH_EVENT_TYPE` in `.Workflow/agent-workflows/implement/implement.ts`, spelled here
# and re-exported from `integrate.ts` so `integrate-workflow.test.ts` checks the two against one
# constant rather than trusting they were typed the same twice — the same split every other lane
# in this pipeline holds to).
#
# `types:` names this lane's own action, for the reason `audit.yml` gives and ADR-0090 rules — an
# unfiltered trigger woke this lane on every unrelated dispatch, and its four runs to date are four
# skips that read exactly like four failures to a person scanning the history. The job-level `if:`
# below is still the scope rule.
#
# `concurrency` names one fixed group, never interpolated on a PR number or a SHA — DESIGN.md
# §10's "exactly one merge at a time" is a claim about every pull request this lane could ever
# touch, not about one at a time *per pull request*, which is what a per-branch group (the shape
# `review.yml` uses) would actually buy. `cancel-in-progress: false` queues a second dispatch
# behind the first rather than dropping it — a merge attempt that never runs looks exactly like
# one that ran and found nothing, and this lane's whole job is never reading those two as the same
# thing (see `integrate.ts`'s `IntegrateOutcome`).

"on":
  repository_dispatch:
    types: [implementation-opened]

# `issues: write` is what lets this lane finish a ticket rather than only merge one (#195,
# ADR-0094): after the merge, `integrate.ts` shells to this repository's own `bin/close-ticket`,
# which comments the `## Closing record` and closes the issue the pull request named. A
# `permissions:` block replaces the default token rather than adding to it (see
# `shared/workflow-permissions.test.ts`), so without this scope the close would fail on a token
# holding `issues: none` — after the merge had already landed, where nobody is watching.
#
# `actions: read` is what lets this lane read lane 06's verdict (#197). `verify.yml` and this file
# fire on the same dispatch, in parallel, and nothing else connects them: a dispatch run's
# `pull_requests` is empty and the pull request's own head commit carries no check runs, so the
# only place lane 06's answer exists is the Actions API — `verify.yml`'s runs, narrowed to this
# run's own `github.sha`, and that run's jobs.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: integrate
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.action == 'implementation-opened'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR: ${{ github.event.client_payload.pr }}
      HEAD_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A rebase conflict assigns the ticket so it notifies rather than sits in a list — the same
      # variable `run-watchdog.yml` and `fixer.yml` set for the same reason.
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A runner has no git identity, and the rebase this pushes is committed here — same fix
      # `implement.yml` and `audit.yml` needed for their own notes.
      - name: Identify the committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # The whole flow: read the PR's branch, rebase it onto current trunk, re-run the gauntlet
      # against the rebased tree, read lane 06's verdict on this same head commit, merge only on a
      # completed green run that lane 06 also cleared — and then close the ticket that merge
      # delivered, via `bin/close-ticket` against this checkout (#195). One step, not two: the
      # close is a decision about the merge that just happened, and a separate step would have to
      # re-derive from the outside what `integrate.ts` already knows. A ticket that will not close
      # leaves this step green — the merge landed either way.
      #
      # ## Which half of lane 06 binds (#197, ADR-0095)
      #
      # `verify.yml` has two jobs and they do not mean the same thing, so this lane does not treat
      # them alike.
      #
      # **`Immutability` blocks outright.** It is the alarm that an implementer's diff touched
      # `tests/acceptance/`, `vitest.config.ts` or `.github/` (ADR-0053/ADR-0054) — a diff that can
      # silence a check has invalidated whatever this lane's own gauntlet just said about it. A
      # failing one refuses the merge, and so does a job that is skipped, cancelled or still
      # running: `verify.yml` skips that job on its `push: main` runs and waves the skip through in
      # its own downstream `if:`, which is a reading this lane may not copy.
      #
      # **`Restore and run acceptance` binds too, as of ADR-0104.** It did not while lane 04's
      # first-authoring was unwired (#201): no acceptance test named any criterion a dispatch
      # carried, the job refused on the empty set, and it was red for *every* pull request, so
      # binding on it would have stopped the whole chain rather than caught anything (ADR-0095).
      # That ruling named its own expiry — "when #201 lands and that job starts meaning something,
      # this ruling is the thing to revisit" — and #201 has landed. A red one is now a slice whose
      # own acceptance tests do not pass, which is the one thing this lane exists to not merge.
      #
      # Unlike `Immutability`, that job takes minutes rather than seconds, so `integrate.ts` waits
      # for its verdict instead of reading once and calling a still-running job unjudged. The wait
      # is why this job's `timeout-minutes` is 30 rather than 15.
      #
      # `github.sha` is how the two runs are joined: a `repository_dispatch` run executes trunk's
      # copy of the workflow at trunk's tip (ADR-0054), so lane 06's run for this dispatch carries
      # the same commit as this one.
      - name: Integrate the pull request
        run: npx tsx .Workflow/agent-workflows/integrate/integrate.ts "$PR" "$HEAD_SHA"
