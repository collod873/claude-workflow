name: Integrate (reusable)

"on":
  workflow_call:
    inputs:
      verify_workflow:
        type: string
        required: true
      runner:
        type: string
        required: false
        default: ubuntu-latest
      machine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: integrate
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.action == 'implementation-opened'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      PR: ${{ github.event.client_payload.pr }}
      HEAD_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNAL_ASSIGNEE: ${{ github.repository_owner }}
      VERIFY_WORKFLOW: ${{ inputs.verify_workflow }}
    steps:
      - name: Checkout machine
        uses: actions/checkout@v4
        with:
          repository: collod873/claude-workflow
          ref: ${{ inputs.machine_ref }}

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Identify the committer
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Node and install dependencies
        uses: ./.github/actions/node

      - name: Install target dependencies
        working-directory: target
        run: npm ci

      - name: Integrate the pull request
        env:
          TARGET_WORKSPACE: ${{ github.workspace }}/target
        run: npx tsx .Workflow/agent-workflows/integrate/integrate.ts "$PR" "$HEAD_SHA"
