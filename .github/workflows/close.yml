name: Close

"on":
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - env:
          GH_TOKEN: ${{ github.token }}
        run: bin/close
