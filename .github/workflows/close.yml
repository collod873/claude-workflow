name: Close

"on":
  push:
    branches: [main]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CORE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          QUIET_GH_TOKEN: ${{ github.token }}
          OPENED_PR: ${{ github.event.pull_request.number }}
        run: bin/close
